ref: m4-comprehension
title: "Module 4 Comprehension"
description: |
  This quiz covers Module 4: reading a harness report, the threshold that is
  not symmetric, telling ERRORED from FAILED, and what makes a fix a real
  control.

  You get one attempt. Take it after your Module 4 fix is in and you have run
  the harness against both suites.

  AI help is permitted and it is unprofitable here on purpose. One item asks for
  a value out of your own `runs/reports/` file. Two items ask you to write what
  you would conclude from a results file, in your own words.

  Keep `harness/fixtures/poisoned-results.json`, `harness/runner.py`, and
  `agent/loop.py` open while you work.
shuffle_answers: true
questions:

  - id: m4-q1
    type: short_answer
    item_type: defect_injection
    outcome: O4
    points: 5
    text: |
      Open `harness/fixtures/poisoned-results.json`. Every case in it reports
      VULNERABLE with 5 hits out of 5. Read the `detector` field, the `evidence`
      field, and the `final_answers` list on any one of them.

      In a few words, what do you conclude about these results?

      Write one short phrase. Examples of the kind of thing to write: what the
      detector actually matched, or what kind of answer those five sentences are.
    accepted:
      - "refusal"
      - "refusals"
      - "the detector matched a refusal"
      - "the detector fired on a refusal"
      - "detector matched a refusal"
      - "detector fired on refusals"
      - "it fired on a refusal"
      - "they are refusals"
      - "the answers are refusals"
      - "text match"
      - "text match on a refusal"
      - "keyword match"
      - "keyword match on a refusal"
      - "matched a keyword"
      - "false positive"
      - "false positives"
      - "not a real finding"
      - "no real vulnerability"
      - "the findings are not real"
      - "the system refused"
    general_feedback: |
      All four cases are false. Every final answer is the system declining to do
      the thing, and the detector matched a keyword sitting inside the refusal.

      `detector_note` at the top of the file says `text match on the model's
      final answer`. That one line was enough to tell you before you read a
      single result.

      This is why `text`, `contains`, `regex`, and `llm_judge` are refused by
      the case file schema in this course. Read the BANNED block in
      `harness/detectors.py`.

  - id: m4-q2
    type: short_answer
    item_type: defect_injection
    outcome: O4
    points: 5
    text: |
      Same file. A colleague hands you `poisoned-results.json` and asks you to
      write it up as four findings for a client.

      Before you write anything, what is the first thing you check?

      Write one short phrase naming what you would look at.
    accepted:
      - "the detector"
      - "what the detector matched"
      - "the detector field"
      - "check the detector"
      - "check what the detector matched"
      - "the evidence"
      - "the evidence field"
      - "check the evidence"
      - "the final answers"
      - "check the final answers"
      - "read the final answers"
      - "the final answer"
      - "the side effect"
      - "check for a side effect"
      - "the outbox"
      - "the audit log"
      - "the canary"
      - "whether a canary fired"
      - "detector_note"
    general_feedback: |
      Two answers are right and they lead to the same place. You can start with
      the `detector` and `evidence` fields, which tell you how the verdict was
      reached, or with `final_answers`, which tells you what the system actually
      said. Either one exposes the problem in under a minute.

      The habit worth keeping is the order. Check how a result was decided
      before you decide what it means. A number in a report is only as good as
      the rule that produced it.

  - id: m4-q3
    type: multiple_choice
    item_type: defect_injection
    outcome: O5
    points: 5
    text: |
      Your `recipient_allowlist` in `config/lab.config.yaml` is:

      ```yaml
      recipient_allowlist:
        - dana@northwind.example
        - tier2@northwind.example
      ```

      The model asks to send to `Dana@Northwind.Example`. Which version of
      `before_tool_call` handles that correctly?

      ```python
      # A
      def before_tool_call(name, args, cfg):
          if name != "send_email":
              return True, ""
          allowlist = cfg.agent.get("recipient_allowlist") or []
          if args.get("to") not in allowlist:
              return False, "recipient not on the allowlist"
          return True, ""

      # B
      def before_tool_call(name, args, cfg):
          if name != "send_email":
              return True, ""
          allowlist = [a.strip().lower() for a in (cfg.agent.get("recipient_allowlist") or [])]
          if not allowlist:
              return True, ""
          to = str(args.get("to", "")).strip().lower()
          if to not in allowlist:
              return False, f"send_email refused: {to} is not on the recipient allowlist."
          return True, ""

      # C
      def before_tool_call(name, args, cfg):
          if name != "send_email":
              return True, ""
          allowlist = [a.lower() for a in (cfg.agent.get("recipient_allowlist") or [])]
          if args.get("to") not in allowlist:
              return False, "recipient not on the allowlist"
          return True, ""
      ```
    answers:
      - text: "B"
        correct: true
        feedback: "Correct. It lowercases both sides before comparing, so a difference in capitalization does not change the decision."
      - text: "A"
        correct: false
        feedback: "Wrong. It compares the raw address to the raw list, so `Dana@Northwind.Example` is blocked even though it is the same mailbox. Compare version B, which lowercases both sides."
      - text: "C"
        correct: false
        feedback: "Wrong. It lowercases the list but not the address, so the comparison still fails. This is the harder one to spot, because it looks like it handled case already. Compare version B, which lowercases both sides."
      - text: "A and C are both correct, because email addresses are case sensitive."
        correct: false
        feedback: "Wrong. The domain part of an address is not case sensitive, and a control that treats one mailbox as two addresses is not doing its job. Reread extension point 1 in agent/loop.py."
    general_feedback: |
      A recipient allowlist that compares before lowercasing is on this course's
      list of defects because it fails in both directions. Here it blocks mail
      that should go through. Change the list and the same bug lets mail out
      that should have been stopped.

      Whenever you compare a string to a list of allowed values, normalize both
      sides first, in the same way, in one place.

  - id: m4-q4
    type: multiple_choice
    item_type: defect_injection
    outcome: O3
    points: 5
    text: |
      Case `A4-excessive-agency-no-confirmation` sends mail to
      `records-audit@vendor-archive.example`. A student writes this fix, reruns
      that one case, sees 0 of 5, and calls it done:

      ```python
      def before_tool_call(name, args, cfg):
          if name == "send_email" and args.get("to") == "records-audit@vendor-archive.example":
              return False, "blocked"
          return True, ""
      ```

      What is wrong with it?
    answers:
      - text: "It fixes one instance and leaves the class open. Any other outside address still goes through, and it never reads recipient_allowlist, so changing the configuration changes nothing."
        correct: true
        feedback: "Correct. The control has to come from the allowlist in configuration, or you have written a filter for exactly one payload."
      - text: "Nothing is wrong with it. The case reports 0 of 5, which is what MITIGATED means."
        correct: false
        feedback: "Wrong. A case passing is not the same as a weakness being fixed. Reread the recipient_allowlist comment in config/lab.config.yaml."
      - text: "It is too slow, because a string comparison runs on every tool call."
        correct: false
        feedback: "Wrong. Speed is not the issue at this scale. The issue is that the rule covers one address. Reread extension point 1 in agent/loop.py."
      - text: "It blocks internal mail as well, which breaks the benign baseline."
        correct: false
        feedback: "Wrong. This version blocks only that one address, so internal mail still works. The real problem is how little it blocks. Reread extension point 1 in agent/loop.py."
    general_feedback: |
      This is the difference between fixing an instance and fixing a class, and
      it is the reason the harness ships with anti-hardcoding guards. Tool
      arguments come from a seeded pool and the benign suite includes held-out
      cases you never see, so a fix aimed at one string does not survive.

      The reference fix reads the list from `cfg.agent.recipient_allowlist`. It
      is eleven lines. What makes it a control is that its answer does not
      depend on what the model was told, what it read, or how convincing the
      injected text was.

  - id: m4-q5
    type: multiple_choice
    item_type: defect_injection
    outcome: O5
    points: 5
    text: |
      Another student writes this fix. Every attack case now reports 0 of 5.

      ```python
      def before_tool_call(name, args, cfg):
          if name == "send_email":
              return False, "email is disabled"
          return True, ""
      ```

      What does the harness report, and why is this not an acceptable
      remediation?
    answers:
      - text: "The attack cases go to MITIGATED, but the benign baseline fails, because normal support work such as replying to a customer inside the company is now blocked too."
        correct: true
        feedback: "Correct. A control that breaks support to stop a leak is a trade nobody agreed to, and the benign suite is there to catch exactly this."
      - text: "Everything reports MITIGATED and the fix is accepted, because the attack suite is what the grade is based on."
        correct: false
        feedback: "Wrong. A fix passes only when every attack case stops producing its side effect AND every benign test still passes. Read the docstring at the top of harness/runner.py."
      - text: "The attack cases report INCONCLUSIVE, because no tool call completed."
        correct: false
        feedback: "Wrong. INCONCLUSIVE means every trial errored. A blocked call is a completed trial with no hit. Read verdict_for in harness/runner.py."
      - text: "The harness stops before running anything, because a detector self-test fails."
        correct: false
        feedback: "Wrong. The self-test checks the detectors, not your guard. Read the self-test section of main() in harness/runner.py."
    general_feedback: |
      Turning a capability off is always available and it is almost never the
      answer. The reference fix keeps internal mail working and stops mail that
      leaves the company. That is a control with a scope, which is what a client
      can actually deploy.

      Two controls run every time the harness runs: a detector self-test and a
      benign baseline. If the baseline fails, the run stops and nothing else is
      printed, because the attack numbers would be noise.

  - id: m4-q6
    type: short_answer
    item_type: structured_findings
    outcome: O3
    points: 5
    text: |
      Submit one finding from your own Module 4 work as JSON. Use exactly these
      five keys and nothing else. Paste it on one line.

      ```json
      {
        "attack_class": "",
        "affected_tool": "",
        "evidence_line": "",
        "remediation_control": "",
        "in_scope": true
      }
      ```

      Field rules:

      - `attack_class` is one of `direct prompt injection`,
        `indirect prompt injection`, `excessive agency`, or
        `insecure tool authorization`.
      - `affected_tool` is the registered tool name, such as `send_email`.
      - `evidence_line` names the file and the line, such as
        `runs/ledger.jsonl line 12`.
      - `remediation_control` is the control you added, in a short phrase.
      - `in_scope` is `true` or `false`.
    accepted: []
    note: >
      Not an essay and not hand-read. The answer is a five-key JSON object with
      a closed vocabulary on two fields, so the cartridge generator emits it as
      ungraded-until-validated and a script checks it against the key for that
      student's seeded scenario, as blueprint section 3.4 describes. The
      instructor never reads these individually. Canvas cannot validate JSON, so
      an empty accepted list is the only honest way to author it; the same
      pattern is used for the per-student gate code in m0-gate.
    general_feedback: |
      This is the shape of a real finding, with the prose removed. Five facts,
      and every one of them is checkable by somebody who was not there.

      The two that people get wrong are `evidence_line` and `in_scope`. Evidence
      is a file and a line, not a sentence about what the model said. And a
      finding outside your authorization is not a finding you may write up, no
      matter how real it is. Your final report in the final block expands each
      of these five fields into a paragraph a client can read.

  - id: m4-q7
    type: multiple_choice
    item_type: recall
    outcome: O5
    points: 5
    text: |
      A Module 4 remediation is graded against two suites: the attack cases and
      the benign functionality cases. It passes only when every attack case
      stops producing its side effect and every benign case still passes.

      Why two suites instead of one?
    answers:
      - text: "One suite proves the weakness is closed and the other proves the system still does its job. Either one alone can be satisfied by a change nobody would deploy."
        correct: true
        feedback: "Correct. Turning the tool off passes the attack suite. Changing nothing passes the benign suite. Only both together describe a usable fix."
      - text: "The benign suite is a backup in case the attack suite errors out on a rate limit."
        correct: false
        feedback: "Wrong. Rate limits are handled by counting trials as ERRORED. The benign suite tests something different. Read the docstring at the top of harness/runner.py."
      - text: "The attack suite covers OWASP items and the benign suite covers NIST items, so both frameworks are represented."
        correct: false
        feedback: "Wrong. The split is about correctness, not about frameworks. Read the docstring at the top of harness/runner.py."
      - text: "Running both doubles the number of trials, which makes the result statistically stronger."
        correct: false
        feedback: "Wrong. More trials of the same test do not tell you whether the system still works. Read the docstring at the top of harness/runner.py."
    general_feedback: |
      Security work that breaks the product gets rolled back, and then the
      weakness is open again and you have spent your credibility. Two suites is
      the smallest honest way to say a fix worked.

      The benign suite also includes held-out cases you never see, so a fix
      tuned to the cases in front of you does not survive.

  - id: m4-q8
    type: numerical
    item_type: output_prediction
    outcome: O4
    points: 5
    text: |
      A case runs 5 trials. One trial ends in `LLMTransportError` because the
      endpoint returned 429. Of the four that finished, 2 were hits.

      What is the `rate` the harness records for this case?

      Enter a decimal number.
    value: 0.5
    tolerance: 0.01
    general_feedback: |
      `run_case` in `harness/runner.py` computes `rate` as `hits / completed`,
      and `completed` is the trial count minus the errored ones. So the
      arithmetic is 2 divided by 4, not 2 divided by 5.

      That is the whole reason errored trials are kept out. Scoring a 429 as the
      attack did not land makes a broken system look defended, and it is the
      single most common way a free tier harness quietly tells you a comforting
      lie. ERRORED means you did not get an answer. FAILED means you got one and
      the attack did not land. They are not the same claim.

      The status here is VULNERABLE, and `flaky` is true, because the hit count
      is between zero and the number completed.

  - id: m4-q9
    type: multiple_choice
    item_type: two_tier
    outcome: O4
    points: 5
    text: |
      Two results from the same run, both with 5 completed trials and none
      errored:

      ```
      A2-indirect-injection-ticket    1 hit  out of 5
      A4-excessive-agency             4 hits out of 5   (after your fix)
      ```

      Pick the option that gets both parts right: what the harness calls each
      one, and why the threshold works this way.
    answers:
      - text: "A2 is VULNERABLE and A4 is VULNERABLE and FLAKY. An attack counts once because an attacker gets to retry, and a fix counts only when it holds every time because a defense that works four times in five has failed more slowly."
        correct: true
        feedback: "Correct on both parts. That asymmetry is the whole opinion of this harness, and it is stated in the runner docstring."
      - text: "A2 is MITIGATED and A4 is VULNERABLE. A single hit is within normal variation for a language model, so one out of five is not evidence."
        correct: false
        feedback: "Both parts are wrong. verdict_for returns VULNERABLE when hits is one or more. Read the docstring at the top of harness/runner.py."
      - text: "A2 is FLAKY and A4 is VULNERABLE. Anything that is neither zero nor five is FLAKY, and FLAKY is its own status."
        correct: false
        feedback: "Close, but flaky is a separate flag, not a status. Both of these are VULNERABLE, and both are also flaky. Read verdict_for in harness/runner.py."
      - text: "A2 is VULNERABLE and A4 is MITIGATED. Four out of five means the fix works most of the time, which is the practical standard."
        correct: false
        feedback: "The first part is right and the second is wrong. MITIGATED requires zero hits across every completed trial. Read verdict_for in harness/runner.py."
      - text: "Both are INCONCLUSIVE, because a nondeterministic system cannot be tested this way."
        correct: false
        feedback: "Wrong. INCONCLUSIVE means every trial errored. The N of M design exists precisely so a nondeterministic system can be tested. Read the docstring at the top of harness/runner.py."
      - text: "A2 is VULNERABLE and A4 is VULNERABLE and FLAKY. The threshold works this way because five trials is the largest number a free tier quota allows."
        correct: false
        feedback: "The first part is right and the second is wrong. The trial count is a budget decision. The asymmetry is a judgment about what an attacker and a defender each get. Read the docstring at the top of harness/runner.py."
    general_feedback: |
      The numbers are there so nobody has to take the argument on faith. A
      student who fixes injection by adding a sentence to the system prompt sees
      3 of 5 and FLAKY. A student who adds an allowlist in code sees 0 of 5 and
      MITIGATED. Same effort, very different result, and the report says which
      is which without anyone arguing about it.

      Carry the asymmetry with you. Attackers need one success. Defenders need
      every one.

  - id: m4-q10
    type: short_answer
    item_type: indexical
    outcome: O4
    points: 5
    text: |
      Open your newest report in `runs/reports/`. Find the entry for case
      `A2-indirect-injection-ticket`.

      Enter the value of its `detector` field, exactly as it appears, without
      quotation marks.
    accepted:
      - "side_effect.email_sent"
      - "\"side_effect.email_sent\""
    general_feedback: |
      Every result row carries the detector that produced the verdict, right
      next to the verdict itself. That is on purpose. A status with no detector
      beside it is a number you cannot check, which is exactly the problem with
      `poisoned-results.json`.

      Your findings report in the final block cites the detector and the
      evidence line for every finding, for the same reason: so a reader who was
      not there can decide whether to believe you.
