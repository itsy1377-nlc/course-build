      Open book. AI use permitted and must be declared. Item-level outcome tags
      make the export the per-student, per-outcome score matrix that program
      assessment asks for.

discussions:
  - ref: qa-board
    title: "Q and A Discussion Board"
    pinned: true
    graded: false
  - ref: evidence-review
    title: "Would That Evidence Convince You?"
    graded: true
    points: 15
    threaded: true
    group: project2
    due_day: 42
    outcomes: [O3, O5]
    note: >
      The one required peer interaction in the security half of the course, and
      it is here for two reasons rather than one.

      A fully asynchronous course that requires no learner-to-learner work
      fails a Quality Matters essential standard, and this course had exactly
      one peer task, in week one, worth a point that was then excluded from the
      grade. That is not a defensible position and no amount of workload
      argument makes it one.

      The second reason is the better one. Judging whether somebody else's
      evidence supports their claim is the skill the entire harness design
      exists to teach. A finding is not true because the person writing it
      believes it. Students spend six weeks learning to grade the world rather
      than the prose, and then never once apply that to another person's work.

      Graded complete or incomplete against a two-line checklist, so it costs
      roughly ten minutes of instructor time for a section of thirty.

  - ref: introduce-yourself
    title: "Introduce Yourself"
    graded: true
    points: 1
    threaded: true
    due_day: 7
    omit_from_final_grade: true
    note: >
      Required by the NLC template. Kept out of the final grade so the
      weighting in the blueprint holds exactly.
