      Attendance verification for census, the graded Rules of Engagement
      acknowledgment, and proof of a working environment, in one instrument.

  - ref: m1-comprehension
    title: "Module 1 Comprehension"
    group: project1
    points: 50
    due_day: 14
    allowed_attempts: 1
    outcomes: [O1, O6]

  - ref: m2-comprehension
    title: "Module 2 Comprehension"
    group: project1
    points: 50
    due_day: 28
    allowed_attempts: 1
    outcomes: [O2, O1, O6]

  - ref: m3-comprehension
    title: "Module 3 Comprehension"
    group: project2
    points: 40
    due_day: 42
    allowed_attempts: 1
    outcomes: [O3, O4, O6]

  - ref: m4-comprehension
    title: "Module 4 Comprehension"
    group: project2
    points: 50
    due_day: 49
    allowed_attempts: 1
    outcomes: [O5, O3, O4]

  - ref: final-part-a-exam
    title: "Final Part A: Comprehensive Exam"
    group: project2
    points: 120
    unlock_day: 52
    due_day: 54
    time_limit_minutes: 180
    allowed_attempts: 1
    shuffle_answers: true
    outcomes: [O1, O2, O3, O4, O5, O6]
