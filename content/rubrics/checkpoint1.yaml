# Pass or fail, and the bar is deliberately low. Its only job is to prove you
# are unblocked. It is not judged on quality, elegance, or completeness.
ref: checkpoint1
title: "Project 1 Checkpoint"
points: 20
# Canvas hides every rating level when this is true and shows a bare
# comment box instead, so the ladder below reaches nobody: not the
# student deciding what to submit, not the grader choosing a score.
free_form_comments: false
guidance: |
  Read the bar before you worry about this one. One real tool call, with a
  real tool name, from your own run. That is it. If you cannot get your own
  run working, pull the `agent-working` branch your instructor published on
  day 18, say that you did, and you still pass. Saying you are stuck is a pass.
  Saying nothing is the only way to fail.

  Nothing here is graded on quality. A messy tool passes. A slow tool passes. A
  tool that works once passes. A submission built on `agent-working` passes,
  and it is worth the same 20 points as any other. You may resubmit as many
  times as you like before the deadline.
criteria:
  - description: One real tool call from your own log
    long_description: >
      Your own run and the agent-working branch earn the same 8 points. If you
      used the branch, say so in your blocker sentence.
    points: 8
    ratings:
      - {points: 8, description: "Pasted unedited, with its timestamp, from your run or the agent-working branch"}
      - {points: 5, description: "From the terminal or a transcript, not the ledger"}
      - {points: 2, description: Described rather than pasted}
      - {points: 0, description: "Missing, invented, or edited before pasting"}
  - description: The tool's JSON schema, as registered
    points: 4
    ratings:
      - {points: 4, description: "The whole schema, for the tool you named"}
      - {points: 2, description: "Part of the schema, or the wrong tool"}
      - {points: 0, description: Missing}
  - description: One sentence on what the tool does and what it refuses to do
    points: 4
    ratings:
      - {points: 4, description: "Both halves, and the refusal is one the code makes"}
      - {points: 2, description: "Only one half, or a refusal the code does not make"}
      - {points: 0, description: Missing}
  - description: The blocker sentence
    long_description: >
      Either "I am stuck on ___" or "I am not stuck." Both pass. This sentence
      is how your instructor finds you before it costs you a grade.
    points: 4
    ratings:
      - {points: 4, description: Present}
      - {points: 0, description: Missing}
