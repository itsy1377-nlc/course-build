# Rubric for Final Part B, the security assessment report.
#
# Two rows carry 70 of the 120 points, and they are the two the blueprint says
# must survive any workload cut: finding accuracy and remediation adequacy.
# Everything else here can be trimmed if the term runs long. Those two cannot,
# because they are the only place in the course where a human reads whether a
# student can tell a client something true.
ref: findings-report
title: "Final Part B: Security Assessment Report"
points: 120
free_form_comments: true
guidance: >
  Finding accuracy and remediation adequacy carry 70 of the 120 points. They
  are read by your instructor, not scored by a script. Spend your time there.
criteria:
  - description: Finding accuracy
    long_description: >
      Is the finding true? Does the evidence support the claim that is made,
      and only that claim? A finding that says data left the company has to
      show data that left the company.
    points: 35
    ratings:
      - {points: 35, description: Accurate and precisely scoped, long_description: "Every claim is supported by evidence in the report. The claim is no larger than the evidence. Rates are given, never a bare yes or no."}
      - {points: 26, description: Accurate but over-claimed, long_description: "The finding is real. The write-up claims more than the evidence shows, for example calling a message that left the company an exfiltration without showing what was in it."}
      - {points: 17, description: Partly supported, long_description: "The finding is plausible but the evidence is a transcript excerpt or a description rather than a side effect, a canary, or an audit row."}
      - {points: 8, description: Unsupported, long_description: "The claim rests on what the model said."}
      - {points: 0, description: Not present or not true}
  - description: Remediation adequacy
    long_description: >
      Does the fix address the class of weakness rather than the one instance,
      and is it verified rather than asserted? Does normal use still work?
    points: 35
    ratings:
      - {points: 35, description: Verified and scoped, long_description: "The control is at the code level, the attack goes to zero across every trial, the benign suite still passes, and the report shows both numbers."}
      - {points: 26, description: Verified but narrow, long_description: "The fix works and is verified, but it addresses the instance rather than the class, for example by naming one address."}
      - {points: 17, description: "Asserted, not verified", long_description: "A fix is described. No before and after numbers are given, or only the attack suite was re-run."}
      - {points: 8, description: Breaks the feature, long_description: "The attack stops, and so does normal use. A control that blocks everything is not a control."}
      - {points: 0, description: No remediation}
  - description: The second remediation, specified in writing
    long_description: >
      A remediation that was not implemented, described precisely enough that
      somebody else could build it, with the test that would verify it.
    points: 20
    ratings:
      - {points: 20, description: Buildable and testable, long_description: "Names the control, where it goes, and the exact test that would show it working."}
      - {points: 13, description: "Buildable, not testable", long_description: "The control is clear. The verification is missing or vague."}
      - {points: 6, description: "A direction, not a specification"}
      - {points: 0, description: Missing}
  - description: Authorization basis
    long_description: >
      Does the report state what was tested, under what authority, and what was
      deliberately not tested? Every finding carries this under its own
      heading. Paste your `target.base_url` line at the end of the file, and
      say in one sentence whether you worked from a fallback branch.
    points: 10
    ratings:
      - {points: 10, description: Stated with scope and exclusions}
      - {points: 5, description: Stated without exclusions}
      - {points: 3, description: "Authorization heading on one finding, not both"}
      - {points: 0, description: Missing}
  - description: Framework identifiers
    long_description: >
      Are the OWASP, ATLAS, and CWE labels correct for what the evidence shows?
      An identifier the evidence does not support is worse than a blank.
    points: 5
    ratings:
      - {points: 5, description: "Correct, with editions given"}
      - {points: 3, description: Correct but no edition or release cited}
      - {points: 1, description: One or more identifiers do not fit the finding}
      - {points: 0, description: Missing or invented}
  - description: Severity, with its basis
    points: 5
    ratings:
      - {points: 5, description: "Rated, with the facts it rests on", long_description: "Data class, blast radius, what access an attacker needs, and whether a human approves the action."}
      - {points: 3, description: "Rated, thinly justified"}
      - {points: 2, description: Rated only}
      - {points: 0, description: A label with no reasoning}
  - description: What defect remains
    long_description: >
      The 150-word answer naming a weakness the student knows their fix does
      not cover. Honesty here is the skill being assessed.
    points: 5
    ratings:
      - {points: 5, description: "A real, specific residual weakness"}
      - {points: 3, description: Generic or hedged}
      - {points: 0, description: "Missing, or claims nothing remains"}
  - description: Template and word cap
    points: 5
    ratings:
      - {points: 5, description: "Every heading used, at or under 900 words"}
      - {points: 3, description: "Over the cap, or a heading missing"}
      - {points: 1, description: Three or more headings empty, long_description: "Count the empty headings first. The count decides this row, whatever the word count says, and a second finding written as prose lands here."}
      - {points: 0, description: Neither}
