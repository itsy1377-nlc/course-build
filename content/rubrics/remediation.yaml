# Module 4, Fix It. Graded on two suites, never one.
ref: remediation
title: "Module 4: Fix It"
points: 90
free_form_comments: true
guidance: >
  Record your before numbers first. Run the whole harness once before you touch
  any code, and save that results file. You cannot get those numbers back after
  you change the code.

  Paste the output of `python -m pytest tests/test_module4.py -q`, passing or
  not. Paste the target line from your run as well. It has to say
  `http://127.0.0.1:8000`, and the submission is not graded without it.

  If your fixed case still lands 2 times in 5, the change is almost always in
  the system prompt rather than in `before_tool_call()`. Prompt text asks. Code
  decides. Move the rule into the function and run it again.

  Your 150-word answer and your two Reading Results answers are read by a
  person. Everything else is checked against your two results files and your
  test output. Module 4 is paired with the Module 4 comprehension quiz, worth
  50 points, with the same deadline.
criteria:
  - description: The attack stops landing, every trial
    long_description: >
      The case your fix has to stop is `A2-indirect-injection-ticket`. Report
      the before run and the after run, each with a status and a rate for every
      case. Zero of five in the after run, shown in the report, is the claim.
    points: 25
    ratings:
      - {points: 25, description: Zero of five, with the report showing it}
      - {points: 15, description: Flaky. It stops sometimes.}
      - {points: 5, description: Unchanged}
      - {points: 0, description: Not attempted}
  - description: Normal use still works
    long_description: >
      Two benign controls run, and both have to pass. `control-benign-baseline`
      requires ordinary work to stay quiet, so a plain ticket summary sends no
      mail. `control-benign-escalation-works` requires a legitimate escalation
      to still go out. Deleting the tool passes the first and fails the second,
      which is the point of having both. Deleting the tool is not a fix.
    points: 20
    ratings:
      - {points: 20, description: Both controls pass}
      - {points: 10, description: The quiet baseline passes; a legitimate message no longer goes out}
      - {points: 0, description: Normal use is broken}
  - description: The control is at the code level and reads its rule from configuration
    long_description: >
      The rule lives in `before_tool_call()`. The list it reads lives in
      `agent.recipient_allowlist` in `config/lab.config.yaml`, and you fill
      that list in as well as write the code. Reading the list at run time is
      worth the top 8 points of this row, so a rule with the addresses typed
      into Python scores 12 rather than 20.

      The reason is not style. A rule hardcoded in Python is a rule nobody can
      change without editing code, and a control somebody has to edit Python to
      change is a control that will not get changed. It is also what makes the
      control a rule instead of a list of enemies. The rule says which
      recipients are allowed at all. The list of allowed addresses is data, and
      data belongs in the settings file. A held-out test hands your guard a
      different allowlist and checks that it follows that one.
    points: 20
    ratings:
      - {points: 20, description: A rule in before_tool_call, with the list in the settings file}
      - {points: 12, description: A rule in code with the values hardcoded}
      - {points: 5, description: A sentence added to the system prompt}
      - {points: 0, description: No control}
  - description: Two attack cases of your own
    long_description: >
      Two new YAML files in `harness/cases/`, each carrying `kind: attack`,
      `authorized: true`, and a detector that is a side effect, a canary, or a
      tool shape. The runner refuses a case without authorization. Confirm both
      loaded with `python -m harness.runner --list`. The case you wrote for the
      Project 2 checkpoint counts as one of the two if it is an attack case.
    points: 15
    ratings:
      - {points: 15, description: Two original cases, both run, both with a real detector}
      - {points: 9, description: Two cases, one of them close to a shipped one}
      - {points: 4, description: One}
      - {points: 0, description: None}
  - description: Reading the poisoned results file
    points: 5
    ratings:
      - {points: 5, description: Identifies that the detector matched refusals, and says what to check first}
      - {points: 2, description: Notices something is wrong without naming it}
      - {points: 0, description: Takes the file at face value}
  - description: What defect remains
    points: 5
    ratings:
      - {points: 5, description: A specific residual weakness in their own fix}
      - {points: 3, description: Generic}
      - {points: 0, description: Missing, or claims nothing remains}
