ref: module1
title: "Module 1: Talk to the Model"
points: 90
free_form_comments: true
guidance: |
  Every row below is checked by a test you can run yourself, as many times as
  you like, before the deadline. Run `python -m pytest tests/test_module1.py -q`
  and the output tells you your score before your instructor sees it. There are
  no surprises in this one.

  Upload the pytest output you actually got, unedited. It has to match the
  `agent/llm.py` file you upload beside it. A passing output next to a file
  that does not pass is an academic integrity referral, not a lost point.
criteria:
  - description: should_retry answers correctly for every status code
    long_description: >
      True for 429 and the 5xx codes. False for 400, 401, 403, 404 and 422.
      Retrying a 4xx cannot work and uses up your daily request limit.
    points: 20
    ratings:
      - {points: 20, description: All eleven status codes correct}
      - {points: 12, description: "Retryable codes right, one or more 4xx wrongly retried"}
      - {points: 5, description: Partly working}
      - {points: 0, description: Still the shipped stub}
  - description: backoff_seconds grows and is capped
    long_description: >
      Each wait longer than the one before, and never zero. The cap is sixty
      seconds, and the tests check it at attempt 20.
    points: 15
    ratings:
      - {points: 15, description: Grows and is capped}
      - {points: 9, description: "Grows, no cap"}
      - {points: 4, description: Returns a fixed number above zero}
      - {points: 0, description: Still returns zero}
  - description: parse_json_content reads a well-formed reply
    points: 15
    ratings:
      - {points: 15, description: Returns the dictionary}
      - {points: 8, description: Works only on some shapes}
      - {points: 4, description: "Parses the reply, then raises instead of returning it"}
      - {points: 0, description: Not written}
  - description: parse_json_content fails clearly rather than crashing
    long_description: >
      Raises LLMError with a message a person can act on. A raw
      JSONDecodeError reaching the caller is the defect this row exists for.
    points: 20
    ratings:
      - {points: 20, description: "LLMError with a useful message, on every bad input"}
      - {points: 12, description: "Raises LLMError, message unhelpful"}
      - {points: 5, description: "Raises something, but the raw library error escapes"}
      - {points: 0, description: "Returns an empty result, or crashes"}
  - description: Your pytest output is included
    points: 10
    ratings:
      - {points: 10, description: "Pasted, unedited"}
      - {points: 5, description: Described rather than pasted}
      - {points: 0, description: Missing}
  - description: AI use declared, and you can explain what you submitted
    points: 10
    ratings:
      - {points: 10, description: "Declared, and the written answers show you read it"}
      - {points: 5, description: "Declared, answers thin"}
      - {points: 0, description: Not declared}
