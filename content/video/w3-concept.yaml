id: w3-concept
title: The inversion
kind: concept
module: m03
embed_on: content/pages/w3-overview.md
blurb: Four minutes on the one line that hands the model your function list, and the one place in the loop that can still say no.
voice: af_heart
explains:
  - content/pages/w3-content.md
  - content/pages/w3-annotated-skeleton.md

scenes:
  - type: slide
    layout: title
    eyebrow: Week 3
    heading: |
      The inversion
    body: |
      Your script stops giving orders
      and starts taking requests.
    narration:
      - This week the direction flips.
      - Until now your script called the model. From here the model calls your code.
      - That is one line of difference, and it changes who is in charge.

  - type: slide
    layout: compare
    eyebrow: Two shapes
    heading: What changed between the weeks
    items:
      - "Week 2 | You built the message list. You called the model. It sent back text. Your script printed it."
      - "Week 3 | You pass a list of tools. The reply can name one of them. Your code runs it."
    narration:
      - Here is the Week 2 shape. You built the message list.
      - You chose when to call the model. It produced text, and your script printed it.
      - Every decision was yours.
      - Now the Week 3 shape. You add one line, and you pass a list of tool schemas.
      - The reply can still be text. Or it can be a request for one of your functions.
      - The model did not change. The call you send did not change much either. One argument did.

  - type: slide
    layout: numbered
    eyebrow: One line, four changes
    heading: Four things moved
    items:
      - You passed a menu
      - The reply can be a request
      - The tool name came from the model
      - The arguments came from the model
    narration:
      - text: Four things moved when you added that line.
        reveal: 0
      - text: First, you passed a menu. The model now knows what your tools are.
        reveal: 1
      - text: Second, the reply can be a request instead of an answer. Your code checks which one arrived.
        reveal: 2
      - text: Third, the tool name came from the model. You never typed search tickets anywhere.
        reveal: 3
      - text: Fourth, the arguments came from the model too. You never typed that query either.
        reveal: 4
      - text: Nothing about the model changed. What changed is where the next decision comes from.
        reveal: 4

  - type: slide
    layout: statement
    eyebrow: The part that trips people up
    heading: The model did not run anything.
    body: |
      It produced text naming a function and some arguments.
      Your Python read that text and made the call.
    narration:
      - Here is the part that trips people up. The model did not run anything.
      - It produced text. That text named a function and some arguments.
      - Your Python read the text, and your Python made the call.
      - You still own every line that runs. You no longer own the choice of which line runs next.
      - That is the inversion, and it is what makes an agent an agent.

  - type: slide
    layout: title
    eyebrow: Remember this
    heading: |
      The model asks.
      Your code answers.
    narration:
      - If you keep one sentence from this week, keep this one.
      - The model asks. Your code answers.
      - Asking is free. Anyone whose text reaches the model gets to ask.
      - Answering is where you decide, and deciding is where security lives.

  - type: slide
    layout: statement
    eyebrow: The schema
    heading: |
      A schema is not documentation.
      It is a promise your code has to keep.
    body: |
      The model never sees your Python.
      It never sees your comments.
    narration:
      - Now the one thing the model ever learns about a tool.
      - It never sees your Python. It never sees your comments.
      - It reads the schema, and that is all it gets.
      - So a schema is not documentation. It is an interface, and a promise your code has to keep.

  - type: slide
    layout: numbered
    eyebrow: Three ways it fails
    heading: When the sign on the door is wrong
    items:
      - A vague description, so the tool runs at the wrong moment
      - An argument with no description, so the model invents a value
      - A schema that does not match the function
    narration:
      - text: A schema fails in three ways, and you will meet all three.
        reveal: 0
      - text: One. A vague description, so the tool runs at the wrong moment, or never runs at all.
        reveal: 1
      - text: Two. An argument with no description. The model invents a value, and the value it invents is wrong.
        reveal: 2
      - text: Three. A schema that does not match the function. Your code then rejects exactly what the schema promised.
        reveal: 3
      - text: In Module 2 you write one of these yourself. The autograder builds arguments from your schema and calls your function with them.
        reveal: 3

  - type: slide
    layout: code
    eyebrow: See it for yourself
    heading: Watch the inversion happen
    body: |
      python -m agent.replay
    narration:
      - You do not have to take my word for any of this.
      - Run python dash m agent dot replay. It walks your last run one step at a time.
      - Next to the step where the model asked for a tool, it prints one line.
      - Nothing in your program chose this.

  - type: slide
    layout: diagram
    eyebrow: One pass of the loop
    heading: The Week 1 picture, with one new box
    diagram:
      kind: flow
      direction: right
      alt: >
        Four boxes left to right. You ask. The model picks a tool and its
        arguments. Then before_tool_call decides, drawn in the accent colour
        as the one place a call can still be stopped. Then the tool runs. A
        return path runs from the end back to the start, because the result
        becomes another message and the loop runs again.
      nodes:
        - label: You ask
          sub: one message in
        - label: The model picks a tool
          sub: and its arguments
        - label: before_tool_call()
          sub: your code decides
          mark: true
          code: true
        - label: The tool runs
          sub: and there is no undo
      loop: the result becomes another message, and the loop runs again
    narration:
      - text: This is the Week 1 picture with one new box in it.
        reveal: 0
      - text: You ask.
        reveal: 1
      - text: The model picks a tool and its arguments.
        reveal: 2
      - text: Then before tool call decides. It runs after the arguments are parsed, one line before the tool runs.
        reveal: 3
      - text: That gap is the last moment anything can be stopped.
        reveal: 3
      - text: Then the tool runs. A record is read, or an email is queued, and there is no undo.
        reveal: 4
      - text: The result becomes another message, and the loop runs again.
        reveal: 5

  - type: slide
    layout: closing
    eyebrow: This week
    heading: It ships wide open.
    body: |
      before_tool_call says yes to everything.
      You do not change it in Week 3. You learn where it sits.
    narration:
      - Right now that function says yes to everything, every time.
      - You do not change it this week.
      - You come back to it in Module 4, four weeks from now.
      - Learn where it sits, and remember one thing about it. A blocked call still gets a line in the ledger.
      - That line is your proof the guard did something.
      - Your job this week is smaller than it sounds. Get one real tool call into your log.
      - That is the checkpoint, and it is pass or fail. Working code is not the bar.
