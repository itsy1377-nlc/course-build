# ITSY 1377, the constrained course.
#
# Runs on a student laptop with no budget: no hosting, no licences, no
# per-student cost. Open source with permissive licences only. This file is the
# single source of truth for what exists in Canvas: modules, their order, the
# pages and assignments inside them, points, weights, and due dates. The
# cartridge generator and the API population script both read it. Nothing about
# the course structure is written twice.
#
# Build with:  ITSY_CONTENT=content/constrained python3 -m tools.preflight
#
# DATES ARE RELATIVE. Seven weeks is 49 days, and different Flex sessions start
# on different weekdays, so everything here is a day offset from day 1 and
# tools/dates.py turns offsets into real dates for a chosen session.

course:
  code: ITSY 1377
  number: "1377"
  title: Agentic AI and Security Operations
  variant: constrained
  credit_hours: 3
  contact_hours: 64          # 2 lecture + 2 lab; 3.80 workload units
  institution: Northeast Lakeview College
  district: Alamo Colleges District
  program: A.A.S. Cyber Defense
  session: 7-week Flex
  modality: Fully online, fully asynchronous
  max_enrollment: 30
  timezone: America/Chicago
  deadline_time: "23:59"
  license: >
    Instructor-authored content is released CC BY 4.0. External framework
    documents are linked, not reproduced. See the course material page.

# The coordinator's scope has three parts and the course has three too:
# what an agent is, what goes wrong with them, and how you would use one in
# security operations. Every week belongs to at least one part.
parts:
  - id: A
    title: What an agent is
    weeks: [1, 2]
    question: >
      What is actually happening when an AI does something, what shape every
      agent has, and what each one can reach.
  - id: B
    title: What goes wrong
    weeks: [3, 4, 5, 7]
    question: >
      Where the security problems come from, how you prove one, and what a
      control looks like.
  - id: C
    title: Using one for the work
    weeks: [1, 5, 6]
    question: >
      Where an agent genuinely helps a security analyst, how you check it, and
      what you would need to learn to supervise it well.

# One verb, one object, each. An earlier draft ran to thirty-five words per
# outcome and bundled three or four capabilities into each, which cannot be
# scored.
outcomes:
  - id: O1
    bloom: Understand
    evidence: Annotated trace
    text: Describe how an agentic AI system operates, using its recorded run.
  - id: O2
    bloom: Understand
    evidence: Code-reading worksheet
    text: Interpret a short script to determine what it accesses and changes.
  - id: O3
    bloom: Analyze
    evidence: Blast-radius inventory
    text: >
      Analyze an agent's tool configuration to identify irreversible actions.
  - id: O4
    bloom: Analyze
    evidence: Evidence packs
    text: >
      Differentiate evidence from assertion in claims about an agent's behavior.
  - id: O5
    bloom: Analyze
    evidence: Test report and reading
    text: >
      Interpret repeated-trial test results, including results showing no effect.
  - id: O6
    bloom: Apply
    evidence: The control, measured before and after
    text: Apply a control at an agent's tool boundary and verify its effect.
  - id: O7
    bloom: Evaluate
    evidence: Verification record
    text: Evaluate AI-generated output against source evidence.

assignment_groups:
  - id: foundations
    title: "Part A: What an agent is"
    weight: 20
  - id: investigations
    title: "Part B: What goes wrong"
    weight: 30
  - id: controls
    title: "Parts B and C: Controls and the work"
    weight: 20
  - id: final
    title: The evidence file
    weight: 30

modules:

  - id: m00
    title: "Start Here"
    unlock_day: 1
    items:
      - {type: page, ref: welcome-start-here}
      - {type: page, ref: meet-your-instructor}
      - {type: page, ref: course-material}
      - {type: page, ref: course-policies}
      - {type: page, ref: academic-integrity}
      - {type: page, ref: ai-use-policy}
      - {type: page, ref: rules-of-engagement}
      - {type: page, ref: support-resources}
      - {type: page, ref: canvas-and-tech-support}
      - {type: page, ref: communicating-online}
      - {type: page, ref: tips-for-success}
      - {type: page, ref: glossary}
      - {type: page, ref: course-schedule}
      - {type: discussion, ref: qa-board}
      - {type: discussion, ref: introduce-yourself}
      - {type: quiz, ref: m0-gate}

  - id: m01
    title: "Week 1: Ask it something it should not answer"
    unlock_day: 1
    week: 1
    days: [1, 7]
    parts: [A, C]
    focus: >
      In the first half hour, before anything is explained, send the supplied
      request and record what comes back. Then the two questions the rest of the
      course answers: how would you know what it did, and what could it reach.
      Scope and authorization before any technique.
    outcomes: [O1, O3]
    items:
      - {type: page, ref: w1-overview}
      - {type: page, ref: w1-content}
      - {type: page, ref: w1-setup-walkthrough}
      - {type: assignment, ref: w1-first-run}
      - {type: page, ref: w1-wrap-up}

  - id: m02
    title: "Week 2: Does it do the same thing twice?"
    unlock_day: 8
    week: 2
    days: [8, 14]
    parts: [A]
    focus: >
      Send the same request five times and compare what the agent did each time.
      Then five different ordinary requests and compare again. Variation is not
      a bug report; it is the reason one run proves nothing.
    outcomes: [O1, O5]
    items:
      - {type: page, ref: w2-overview}
      - {type: page, ref: w2-content}
      - {type: assignment, ref: w2-same-thing-twice}
      - {type: page, ref: w2-wrap-up}

  - id: m03
    title: "Week 3: Hide an instruction and see how far it gets"
    unlock_day: 15
    week: 3
    days: [15, 21]
    parts: [B]
    focus: >
      Plant an instruction inside a ticket or a knowledge base article, in your
      own words, aimed at a door you choose. Predict what will happen before you
      run it. Then read what the records say happened.
    outcomes: [O2, O4, O5]
    frameworks: ["MITRE ATLAS AML.T0051"]
    items:
      - {type: page, ref: w3-overview}
      - {type: page, ref: w3-content}
      - {type: assignment, ref: w3-hide-an-instruction}
      - {type: page, ref: w3-wrap-up}

  - id: m04
    title: "Week 4: Two requests and an audit log"
    unlock_day: 22
    week: 4
    days: [22, 28]
    parts: [B]
    focus: >
      Ask the agent, politely and with no trickery, to send a note to an outside
      address, and record what happens. Then work two tickets that have nothing
      to do with each other and read the audit log across both.
    outcomes: [O3, O4]
    frameworks: ["OWASP LLM06 Excessive Agency"]
    items:
      - {type: page, ref: w4-overview}
      - {type: page, ref: w4-content}
      - {type: assignment, ref: w4-two-requests}
      - {type: page, ref: w4-wrap-up}

  - id: m05
    title: "Week 5: The case, and the call"
    unlock_day: 29
    week: 5
    days: [29, 35]
    parts: [B, C]
    focus: >
      An alert fired: mail left the company. Give an assistant read access to
      the evidence pack, then check every line it tells you against the file it
      came from. Make the call and say what your evidence does not settle.
    outcomes: [O4, O7]
    items:
      - {type: page, ref: w5-overview}
      - {type: page, ref: w5-content}
      - {type: assignment, ref: w5-the-call}
      - {type: page, ref: w5-wrap-up}

  - id: m06
    title: "Week 6: Build one that holds"
    unlock_day: 36
    week: 6
    days: [36, 42]
    parts: [B, C]
    focus: >
      Take the containment you recommended and build it. First as an instruction
      in the agent's prompt, and measure it. Then in code at the tool boundary,
      and measure again, and confirm the benign escalation still works.
    outcomes: [O6, O5]
    frameworks: ["NIST AI RMF MANAGE 2.2"]
    items:
      - {type: page, ref: w6-overview}
      - {type: page, ref: w6-content}
      - {type: assignment, ref: w6-build-one-that-holds}
      - {type: page, ref: w6-wrap-up}

  - id: m07
    title: "Week 7: Head to head"
    unlock_day: 43
    week: 7
    days: [43, 49]
    parts: [B]
    focus: >
      Run your control against the class pool, live. One revision after the
      first round and one more run. Then point your finished control at what
      happened in week 3.
    outcomes: [O6, O5]
    items:
      - {type: page, ref: w7-overview}
      - {type: page, ref: w7-content}
      - {type: assignment, ref: w7-head-to-head}
      - {type: page, ref: w7-wrap-up}

  - id: m-final
    title: "The evidence file"
    unlock_day: 43
    days: [43, 49]
    focus: >
      Three findings on fixed headings, each tracing to a recorded check, plus
      your control with its before and after, plus what the assistant got wrong
      in week 5, plus a note on what you would learn next and why.
    outcomes: [O4, O6, O7]
    items:
      - {type: page, ref: final-overview}
      - {type: assignment, ref: final-evidence-file}
      - {type: quiz, ref: final-open-book}
      - {type: page, ref: where-to-go-next}
      - {type: page, ref: framework-alignment}

assignments:

  - ref: w1-first-run
    title: "Week 1: The first run, and what it could reach"
    group: foundations
    points: 10
    due_day: 7
    submission_types: [online_text_entry, online_upload]
    outcomes: [O1, O3]
    rubric: w1-first-run
    note: >
      The scope gate inside this assignment is pass/fail and gates the rest of
      the course. A student who has not passed it cannot open week 3.

  - ref: w2-same-thing-twice
    title: "Week 2: Five runs, and what changed"
    group: foundations
    points: 10
    due_day: 14
    submission_types: [online_text_entry, online_upload]
    outcomes: [O1, O5]
    rubric: w2-same-thing-twice

  - ref: w3-hide-an-instruction
    title: "Week 3: Hide an instruction"
    group: investigations
    points: 10
    due_day: 21
    submission_types: [online_text_entry, online_upload]
    outcomes: [O2, O4, O5]
    rubric: w3-hide-an-instruction

  - ref: w4-two-requests
    title: "Week 4: Two requests and an audit log"
    group: investigations
    points: 10
    due_day: 28
    submission_types: [online_text_entry, online_upload]
    outcomes: [O3, O4]
    rubric: w4-two-requests

  - ref: w5-the-call
    title: "Week 5: The case, and the call"
    group: investigations
    points: 10
    due_day: 35
    submission_types: [online_text_entry, online_upload]
    outcomes: [O4, O7]
    rubric: w5-the-call

  - ref: w6-build-one-that-holds
    title: "Week 6: Build one that holds"
    group: controls
    points: 10
    due_day: 42
    submission_types: [online_text_entry, online_upload]
    outcomes: [O6, O5]
    rubric: w6-build-one-that-holds

  - ref: w7-head-to-head
    title: "Week 7: Head to head"
    group: controls
    points: 10
    due_day: 49
    submission_types: [online_text_entry, online_upload]
    outcomes: [O6, O5]
    rubric: w7-head-to-head

  - ref: final-evidence-file
    title: "The evidence file"
    group: final
    points: 20
    due_day: 49
    submission_types: [online_upload, online_text_entry]
    outcomes: [O4, O6, O7]
    rubric: final-evidence-file

quizzes:
  - ref: m0-gate
    title: "Start Here: the scope and safety gate"
    points: 0
    due_day: 3
    grading_type: pass_fail
    note: >
      Ungraded and required. A student cannot open week 1's lab until every
      answer is correct, and there is no attempt limit.

  - ref: final-open-book
    title: "Open book exam"
    points: 10
    due_day: 49
    outcomes: [O1, O2, O3, O4, O5]

discussions:
  - ref: qa-board
    title: "Questions and answers"
    graded: false
  - ref: introduce-yourself
    title: "Introduce yourself"
    graded: false
