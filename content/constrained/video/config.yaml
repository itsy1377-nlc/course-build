# What the video pipeline needs to know about the constrained course.
# Build with:  ITSY_CONTENT=content/constrained python3 -m tools.video.build --all

course_code: ITSY 1377
course_name: Agentic AI and Security Operations (Constrained)

voice: kokoro:af_heart

# Terminal scenes record against labs/, driving a local granite4.1:3b through
# Ollama's OpenAI compatible endpoint. That endpoint shape is the same one a
# LiteLLM gateway presents, so the constrained course's local model and the
# funded course's gateway differ only in base_url and the key variable name.
#
# Recordings run with the worked solution applied and reverted afterwards, so
# the output on camera is genuine rather than staged. A learner who runs the
# same command sees the same thing.
code_dir: labs

# Work a learner produces themselves. The no-spoiler gate reads the captured
# terminal text and fails if a substantial line from any of these appears on
# camera, so a walkthrough can show output and never source.
answer_globs:
  - solution/*.py
  - solution/**/*.py
  - solution/cases/*.yaml

library_budget_mb: 400
