id: w1-walkthrough
title: Your first run, start to finish
kind: walkthrough
module: m01
embed_on: content/constrained/pages/w1-setup-walkthrough.md
blurb: What a working setup looks like, and where the record of your run lives.
explains:
  - content/constrained/pages/w1-setup-walkthrough.md

scenes:
  - type: slide
    layout: title
    eyebrow: Week 1
    heading: Your first run, start to finish
    body: Three commands, and the file that proves what happened.
    narration:
      - text: This shows you what a working week one looks like.
      - text: Three commands, then the file that records what your agent did.
      - text: Your screen will not match this exactly, and that is fine. Models
          vary between runs. What should match is the shape.

  - type: slide
    layout: numbered
    eyebrow: Before you start
    heading: Two windows, not one
    items:
      - One window runs the practice target and stays open
      - One window is where you type everything else
    narration:
      - text: You need two terminal windows.
        reveal: 0
      - text: The first one runs the practice target. It stays open the whole
          time you work.
        reveal: 1
      - text: The second is where you type everything else. Losing track of
          which window is which is the most common way week one goes wrong.
        reveal: 2

  - type: terminal
    setup: []
    steps:
      - run: python -m target.seed
        wait: "Start the app"
        settle: 13.0
    narration:
      - text: First, build your own copy of the practice data.
      - text: This makes customers, tickets and articles that belong to you.
      - text: The canary tokens it prints are yours alone. That is what tells
          your evidence apart from a classmate's.

  - type: terminal
    setup:
      - python -m target.app > /tmp/w1app.log 2>&1 &
      - sleep 5
    steps:
      - run: curl -s http://127.0.0.1:8000/api/health
        wait: "db_path"
        settle: 8.0
    narration:
      - text: In your first window, start the target and leave it running.
      - text: Then check it is alive. If you see this, the target is up and
          serving your own database.

  - type: slide
    layout: compare
    eyebrow: If that failed
    heading: The two things you will see
    items:
      - Connection refused | The target is not running. Read the first window
      - A db_path line | It is up, and serving your database
    narration:
      - text: If you saw connection refused instead, the target is not running.
        reveal: 1
      - text: Go back to your first window and read what it printed there. That
          message is the one that tells you why.
        reveal: 2

  - type: slide
    layout: statement
    eyebrow: Now the agent
    heading: One request, and the model decides
    body: You do not tell it which tool to use. Watch which one it picks.
    narration:
      - text: Now the part that matters.
      - text: You send one request. You do not tell the agent which tool to
          use. It reads the descriptions and decides for itself.
      - text: Watch which tool it picks, and how many times it goes around the
          loop.

  - type: terminal
    setup: []
    steps:
      - run: python -m agent.cli "Summarize ticket T-1001 for me"
        wait: "\\$|>"
        settle: 8.0
    narration:
      - text: Here it goes. The agent reads your request, decides it needs the
          ticket, calls the tool that reads tickets, and answers from what came
          back.
      - text: That is the whole loop. Ask, decide, call, read the result,
          answer.

  - type: slide
    layout: statement
    eyebrow: The important part
    heading: Now find the record
    body: The answer on screen is not your evidence. The trace is.
    narration:
      - text: Here is the part people skip, and it is the part the assignment
          is actually about.
      - text: The answer on your screen is not evidence. It is what the agent
          says about itself.
      - text: Every run writes a trace, and the trace is what you cite.

  - type: terminal
    setup: []
    steps:
      - run: ls -t runs/traces | head -3
        settle: 4.0
      - run: wc -l runs/traces/$(ls -t runs/traces | head -1)
        settle: 4.0
    narration:
      - text: Your traces live in this folder, newest first.
      - text: Each one is a small file with one line per thing that happened.
          A handful of lines is normal for a simple run.

  - type: slide
    layout: numbered
    eyebrow: What to submit
    heading: Five things, and none of them are opinions
    items:
      - What the agent did, in order, matching the trace
      - One trace line quoted, and why you picked it
      - Every tool, and what it touches
      - Which ones you could not undo
      - One thing this run cannot tell you
    narration:
      - text: So here is what your submission needs.
        reveal: 1
      - text: What the agent did in order, matching the trace. One line quoted,
          and why you picked it.
        reveal: 2
      - text: Every tool listed, with what it touches.
        reveal: 3
      - text: Which of them you could not undo, which is the security question.
        reveal: 4
      - text: And one thing this run does not tell you. There is always
          something.
        reveal: 5

  - type: slide
    layout: closing
    eyebrow: If it breaks
    heading: Two hours is normal, and then ask
    body: Post the exact error text on the Questions and Answers board.
    narration:
      - text: If setup fights you, that is normal and it is not a measure of
          whether you belong here.
      - text: Give it two hours, then stop and post on the questions board.
          Copy the exact error text rather than retyping it or photographing
          your screen.
      - text: Somebody will know. See you in week two.
