      - {type: page, ref: using-the-notebook-server, title: "Using the notebook server"}
      - {type: page, ref: course-policies,         title: "Syllabus, policies and grades"}
      # Ungraded practice quiz, no weight change. template-conflicts item 16.
      - {type: quiz, ref: syllabus-acknowledgment, title: "Syllabus acknowledgment", ungraded: true}
      - {type: page, ref: ai-use-policy,           title: "Using AI in this course"}
      - {type: page, ref: course-schedule,         title: "Course schedule"}
      - {type: page, ref: tips-for-success,        title: "Tips for success"}
      - {type: page, ref: olrn-0001,               title: "OLRN-0001 is required for this course"}
      - {type: page, ref: support-resources,       title: "Getting help"}
      # The standing error card. Added item, per template-conflicts item 4 and
      # the amendment recorded under conflict 27. It is the "what to do when a
      # cell fails" half of the prompt's Start Here help requirement.
      - {type: page, ref: if-something-breaks,     title: "If something breaks"}
      # The template's tenth Orientation item. 1 point in a 0 percent group,
      # per template-conflicts item 8 and grade-distribution section 1.1.
      - {type: discussion, ref: introductions,      title: "Introduce yourself", group: orientation, points: 1}
      - {type: page, ref: glossary,                title: "Glossary"}

