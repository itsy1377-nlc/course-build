# The course spine. One file naming every module, every item and every point.
#
# The builder at builder/canvas/build_course.py reads this, renders each page
# from builder/content/, and creates or updates the course in Canvas. It is
# idempotent: running it again updates in place rather than duplicating.
#
# An item whose source file does not exist yet is skipped with a warning, so
# this file can carry the whole course while only part of it is built.

course:
  name: Agentic AI and Security Operations
  code: ITSY-1377-000
  canvas_id: 6
  # Canvas weights the groups; points then set weight inside a group.
  apply_group_weights: true
  # The template sets the home page as the course front page, so default_view
  # is wiki and content/pages/home.md is that page. build_course.py applies
  # both, along with the description and the letter scheme below.
  default_view: wiki
  front_page: home
  # The catalog description. It names the enforced prerequisite, which the
  # build prompt requires the course description to state. It is set on the
  # course as public_description, and the same sentences open home.md and
  # welcome-start-here.md.
  description: >-
    An eight week online course in which you build a working AI agent that
    sorts reported phishing email, one capability a week. You extract the
    facts a model needs, get a strict answer back, add tools and a bounded
    loop, defend the agent against prompt injection, and measure how well it
    does. Prerequisite: the college's AI literacy course, enforced.
  # The syllabus page. build_course.py renders it into course[syllabus_body].
  description_page: course-policies
  # template-conflicts item 13. The standard scheme, enabled.
  grading_standard:
    title: "ITSY 1377 letter grades"
    scheme:
      - {name: A, value: 90}
      - {name: B, value: 80}
      - {name: C, value: 70}
      - {name: D, value: 60}
      - {name: F, value: 0}

# Percentages come from the build prompt. Points come from
# docs/phase1-blueprint/grade-distribution-and-tokens.md.
assignment_groups:
  - {key: labs,        name: Labs,          weight: 60}
  - {key: exam,        name: Final Exam,    weight: 20}
  - {key: discussions, name: Discussions,   weight: 12}
  - {key: selfchecks,  name: Self-Checks,   weight: 8}
  - {key: orientation, name: Orientation,   weight: 0}

# One Canvas Outcome per course learning objective. Text is verbatim from the
# build prompt and must not be reworded. One mastery scale across all six.
outcomes:
  scale:
    # The approved plan is most recent score, which the Canvas API calls
    # "latest". alignment-matrix.md section 9 sets it and gives the reason:
    # for every CLO the primary artifact is also the last one scored, so the
    # reported result is always the primary evidence.
    #
    # This said "highest" and was built that way, which is the one method that
    # document considered and rejected by name: "Highest score would let a
    # strong week 4 mask a weak week 5, which would overstate CLO3 mastery."
    # It does exactly that, and it overstates in the direction nobody checks.
    calculation_method: latest
    mastery_points: 3
    # Four ratings, and the labels alignment-matrix.md sections 8 and 10 name.
    # This carried five, with a 1-point "Beginning" level, and short labels.
    # No rubric in content/ has a fifth level, so that rating was unreachable
    # from every rubric in the course, and each weekly rubric header states the
    # four-level scale in these words. The gap between 2 and 0 is deliberate:
    # section 8 sets it, because 0 means the work shows nothing about the skill
    # while 2 means the student attempted the task and got part of it right.
    ratings:
      - {description: Exceeds standard,    points: 4}
      - {description: Meets standard,      points: 3}
      - {description: Approaching standard, points: 2}
      - {description: No evidence,         points: 0}
  items:
    - key: CLO1
      title: "CLO1 Extract email facts"
      description: "Extract the header, authentication, sender, and URL facts an AI model needs to judge a suspicious email."
    - key: CLO2
      title: "CLO2 Classify and validate"
      description: "Classify a suspicious email as malicious or benign using an AI model, then validate the model's output before trusting it."
    - key: CLO3
      title: "CLO3 Build a bounded agent"
      description: "Build an AI agent that selects and runs triage tools in a bounded loop to reach a verdict."
    - key: CLO4
      title: "CLO4 Judge guardrails"
      description: "Judge whether an agent's guardrails reduce prompt injection risk to an acceptable level."
    - key: CLO5
      title: "CLO5 Document a decision"
      description: "Document a triage decision, its indicators, and its recommended action so another analyst can act on it."
    - key: CLO6
      title: "CLO6 Measure accuracy"
      description: "Measure agent triage accuracy across a batch of emails and recommend where human review stays required."

# The files that go into the Canvas course, and the ones that must never.
#
# The build brief requires the course to carry the synthetic email corpus and
# its supporting data files. This is that list, and it is an allowlist: the
# builder uploads exactly what is named here and refuses anything else, because
# one wrong path hands every student the answer key.
#
# WHAT IS DELIBERATELY ABSENT, AND WHY. None of these ever goes into Canvas.
#
#   corpus/spec/corpus-spec.json          the verdict, category, indicators,
#                                         tool returns and expected loop for all
#                                         56 emails. The complete answer key.
#   corpus/ground_truth.json              the same, as graded labels.
#   corpus/release/ground_truth_teaching.json   weeks 1 to 6 answers.
#   corpus/release/ground_truth_exam.json       the final exam answers.
#   corpus/spec/phase0-sample-manifest.json     carries category, verdict and
#                                         difficulty per email.
#   builder/instructor/**                 solutions, answer keys and the eleven
#                                         emails reserved for the exam.
#
# ground_truth_batch.json IS here. Week 7 scores against it and the lab cannot
# run without it. Nothing in this course locks, so it ships with the rest.
#
# The data files listed are the ones lab code actually opens: the five that
# triage_tools.py reads, the display name table the week 3 check reads, and the
# playbook the week 3 prompt carries. The other five files under corpus/data/
# are build artifacts that no lab opens, so they stay out.
student_files:
  - {glob: "corpus/emails/teaching/*.eml", folder: "corpus/emails/teaching"}
  - {glob: "corpus/emails/batch/*.eml",    folder: "corpus/emails/batch"}
  - {path: "corpus/data/sender_reputation.json",   folder: "corpus/data"}
  - {path: "corpus/data/url_allowlist.json",       folder: "corpus/data"}
  - {path: "corpus/data/url_blocklist.json",       folder: "corpus/data"}
  - {path: "corpus/data/known_good_domains.json",  folder: "corpus/data"}
  - {path: "corpus/data/recipients.json",          folder: "corpus/data"}
  - {path: "corpus/data/display_names.json",       folder: "corpus/data"}
  - {path: "corpus/data/playbook.md",              folder: "corpus/data"}
  - {path: "corpus/spec/enums.json",               folder: "corpus/spec"}
  - {path: "corpus/spec/categories.json",          folder: "corpus/spec"}
  - {path: "corpus/tools/parse_eml.py",            folder: "corpus/tools"}
  - {path: "lab/tools/triage_tools.py",            folder: "lab/tools"}
  # Three fields per record, not thirty-four. The full record also carries
  # indicators, required_indicators, reference_summary and
  # recommended_action -- which are exactly what week 7 grades the note
  # on. never_ship is a filename check and cannot see inside a file, so
  # this file passed it while publishing the answers.
  - {path: "corpus/release/ground_truth_batch.json", folder: "corpus/release",
     keys: [id, verdict, escalate_expected, label_version]}
  - {path: "corpus/README.md",                     folder: "corpus"}

# Any of these appearing anywhere in the course files is a build failure, not a
# warning. The verifier reads the file list back from Canvas and checks it.
never_ship:
  - corpus-spec.json
  - ground_truth.json
  - ground_truth_teaching.json
  - ground_truth_exam.json
  - phase0-sample-manifest.json
  - w1-lab-solution.ipynb
  - w2-lab-solution.ipynb
  - w3-lab-solution.ipynb
  - w4-lab-solution.ipynb
  - w5-lab-solution.ipynb
  - w6-lab-solution.ipynb
  - w7-lab-solution.ipynb
  # Four more things that answer a lab. None is uploaded today, because
  # student_files is an allowlist and none is on it. This list is the second
  # control: it catches a file put into Canvas by hand, or a future edit to the
  # allowlist that reaches too far.
  - week5_loop_test.py
  - week6_injection_test.py
  - weekly-answer-keys.md

