id: w4-walkthrough
title: What success looks like
kind: walkthrough
module: m04
embed_on: builder/content/pages/w4-content.md
blurb: A real run on an email your lab does not use. The verdict before the tool, the one fact that changed it, and the checks to make before you submit.
explains:
  - builder/content/pages/w4-content.md
  - builder/content/assignments/w4-lab.md

scenes:
  - type: slide
    layout: title
    eyebrow: Week 4 walkthrough
    heading: What a finished run looks like
    body: One email, one tool call, and a verdict that changes. This runs on an email your lab does not use, so nothing here is your answer.
    narration:
      - This is what a finished week 4 run looks like.
      - It runs on an email your lab doesn't use, so nothing here's your answer.
      - One email, one tool call, and a verdict that changes. Watch the verdict.

  - type: slide
    layout: code
    eyebrow: Before any tool
    heading: What last week's agent said
    body: |
      {
        "verdict": "malicious",
        "category": "credential_phish",
        "confidence": 0.85
      }
    narration:
      - The email is a past due statement from a parts supplier.
      - Here's what the agent said with week 3's capability alone. Facts block, playbook, known good hosts, no tools.
      - Malicious, at confidence 0.85. It said that in twenty runs out of twenty.
      - It's wrong. The answer key says this one is benign.
      - The category moved around. Credential phish in eighteen runs, vendor fraud in two. The verdict never moved.

  - type: slide
    layout: code
    eyebrow: What came back next
    heading: The model asked for a fact
    body: |
      stop reason: tool_calls        answer text: empty

      name         check_sender_reputation
      arguments    {"sender":"slatemoorsupply.example"}
    narration:
      - Now the same email again, with the three tool definitions attached.
      - This time no answer text came back at all. The stop reason was tool calls, twenty runs out of twenty.
      - In that empty slot sits one request. A tool name, and the values to pass.
      - It asked about the sender, and passed the domain rather than the whole address. The tool takes either.
      - Exactly one request came back, every time.

  - type: slide
    layout: statement
    eyebrow: The fact that settled it
    heading: Your code ran the tool. The model ran nothing.
    body: status trusted, first seen 2022-06-14, 96 messages in 90 days, two prior reports, the last closed benign on 2026-04-02.
    narration:
      - Your code read that request, picked the matching function, and ran it.
      - The record came back trusted. First seen in June 2022. 96 messages in 90 days. Two earlier reports, and the last closed benign.
      - None of that's in the email, and none of it's in the facts block. Asking was the only way to get it.
      - Then your message carried the result back, with the model's own call id copied across. The two ids matched in twenty runs out of twenty.

  - type: slide
    layout: compare
    eyebrow: The whole point
    heading: The same email, before and after one fact
    items:
      - Without the tool | malicious, confidence 0.85
      - With the tool | benign, legit external, confidence 0.95
    narration:
      - text: Without the tool, malicious, in twenty runs out of twenty. Week 3's capability wasn't enough for this email.
        reveal: 1
      - text: With the tool, benign and legit external, at confidence 0.95, in twenty runs out of twenty.
        reveal: 2
      - text: The answer key says benign and legit external. Right on both fields.
        reveal: 2
      - text: Nothing about the model changed. It got one fact it didn't have before.
        reveal: 2

  - type: slide
    layout: statement
    eyebrow: What should vary
    heading: The tool name can change. The flip should not.
    body: In eighteen runs the model asked about the sender. In two it asked about the link host. Both answers land on benign.
    narration:
      - Your run won't match this one line for line.
      - In eighteen runs out of twenty the model asked for check sender reputation. In the other two it asked for check urls. Both land on benign.
      - The indicators change wording every run. The verdict, the category and the confidence don't.
      - One email with tools costs two model calls. The comparison adds a third. This run came to 4,242 tokens.
      - The fallback never ran here, zero runs out of twenty. It still can. If your model answers in sentences instead, your file records that and earns the same credit.

  - type: slide
    layout: numbered
    eyebrow: Before you submit
    heading: Three checks
    items:
      - The screenshot shows all six rows and the token line
      - The two call ids match on every row
      - Your written answer names one fact from your own file
    narration:
      - text: Three things to check before you turn it in.
        reveal: 1
      - text: First, your screenshot shows all six rows and the token line under them.
        reveal: 1
      - text: Second, open your file and read the two call ids on every row. They have to match.
        reveal: 2
      - text: That pair is your only evidence that you built the message correctly.
        reveal: 2
      - text: Third, your written answer names one email, one tool, and one fact the tool returned.
        reveal: 3
      - text: A general sentence about tool calls won't earn the points. Your own fact will.
        reveal: 3

  - type: slide
    layout: closing
    eyebrow: If it is not working
    heading: The three failures you will actually hit
    body: Arguments read as text. An unknown name that raises instead of returning. Call ids that do not match.
    narration:
      - Three failures are common this week, and all three are in your own code.
      - The arguments arrive as text, not as a dictionary. Turn that text into a dictionary before you read a value out of it.
      - An unknown tool name has to return a plain sentence. Raise an error instead, and one missing name ends the run for all six emails.
      - And if the two call ids don't match, your message didn't carry the model's own id back. Copy it across unchanged.
