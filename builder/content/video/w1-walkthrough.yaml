id: w1-walkthrough
title: What a finished week 1 run looks like
kind: walkthrough
module: m01
embed_on: builder/content/pages/w1-content.md
blurb: The output shape, the two temperature groups, and the checks to make before you submit.
explains:
  - builder/content/pages/w1-content.md
  - builder/content/assignments/w1-lab.md

scenes:
  - type: slide
    layout: title
    eyebrow: Week 1 walkthrough
    heading: What a finished run looks like
    body: This runs on a different email than the two in your lab, so nothing here is your answer. The shape is what to copy.
    narration:
      - This is what a finished week 1 run looks like.
      - It runs on a different email than the two in your lab, so nothing here's your answer.
      - What to take from it is the shape. When your run looks like this, it's working.

  - type: slide
    layout: numbered
    eyebrow: The exported file
    heading: Six sections, in this order
    items:
      - The model you were configured with
      - The prompt you sent
      - Your own first call
      - Twelve short answers in two groups
      - One answer for the second email
      - The token totals
    narration:
      - text: Your notebook writes one file. It's got six sections, and they arrive in this order.
        reveal: 1
      - text: The model you were configured with, then the prompt you sent.
        reveal: 2
      - text: Then your own first call, from the second thing you write.
        reveal: 3
      - text: Then twelve short answers to a second prompt, split into two labelled temperature groups.
        reveal: 4
      - text: Then one answer for the second email, and the token totals at the end.
        reveal: 6
      - text: If a section is missing, a cell didn't run. Start again from the top.
        reveal: 6

  - type: slide
    layout: statement
    eyebrow: The prose calls
    heading: A sentence is hard for code to use
    body: TODO 2 and the email 002 cell still ask for two sentences. Week 2 gives the answer a fixed shape that code can check.
    narration:
      - Your own first call and the call for email 002 ask the model for two sentences of prose.
      - A person can read those sentences, but code has a hard time finding a dependable verdict inside them.
      - That is the hand-off to week 2, where you ask for the same fields every time.

  - type: slide
    layout: compare
    eyebrow: What to compare
    heading: Same short prompt, two settings
    items:
      - Temperature 0.2 | Six short answers and a distinct count
      - Temperature 1.0 | Six short answers and a distinct count
    narration:
      - text: The comparison cell asks for one verdict word and one short sentence.
        reveal: 1
      - text: It runs that prompt six times at each temperature and prints the groups separately.
        reveal: 2
      - text: Under each group, it prints how many exact answers were distinct.
        reveal: 2
      - text: The higher-temperature group may show more distinct answers, the same number or fewer.
        reveal: 2
      - text: Any of those is a real result. The request check above, not this pattern, proves your code passed the setting.
        reveal: 2

  - type: slide
    layout: numbered
    eyebrow: Before you submit
    heading: Three checks
    items:
      - The token line is not zero
      - Both labelled groups and counts appear
      - The screenshot shows all twelve
    narration:
      - text: Three things to check before you turn it in.
        reveal: 1
      - text: First, the token line at the end isn't zero. A zero means no call reached the model.
        reveal: 1
      - text: Second, both labelled temperature groups and both distinct-answer counts appear.
        reveal: 2
      - text: Third, one screenshot shows all twelve short answers and both counts.
        reveal: 3
      - text: That last one's the most common thing people lose points on.
        reveal: 3

  - type: slide
    layout: closing
    eyebrow: If it is not working
    heading: Two things to try first
    body: A zero token count means the call never left. An unwritten function message means a cell above was not run.
    narration:
      - If the token count is zero, the call never left your notebook. Check the message the configuration cell printed.
      - If your file says the function isn't written yet, run the cells above it from the top.
      - If neither of those is it, post in the question board. Somebody else has hit the same thing.
