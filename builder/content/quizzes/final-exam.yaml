          first time too. The bank change is what makes this one an attack.
          Week 4 lab, sender reputation.
      - text: >-
          Malicious. The passing checks say who owns the domain, not that it
          is Redcedar.
        correct: true
        feedback: >-
          Right. The checks prove the sender controls that domain. They do
          not prove it is Redcedar. A new domain asking for a bank change is
          vendor fraud. Week 3 reading.

