# Week 8 final exam. Forty scored multiple choice items at 0.75 points each,
# thirty points, plus six unscored reference blocks. Forty-six entries.
#
# It was thirty items at one point. CLO3, CLO5 and CLO6 had no item at all
# and every item was tagged outcome: none, so the per-outcome matrix the
# program reports was empty for half the outcomes. Ten items were added and
# all forty rescaled, so the exam still weighs thirty points and no grading
# weight moved.
#
# This is the whole exam in one file. It is built as a Canvas Classic Quiz by
# canvas/build_course.py, which reads the settings below and then posts each
# entry in file order. Canvas takes the file order as the exam order.
#
# The design is docs/phase1-blueprint/exam-blueprint.md, which is approved.
# Section 5 of it is the coverage table, one row per question. Every item here
# keeps its blueprint number in its id and in its name, so that table still
# maps onto this file after the reordering below.
#
# The thirty items were written one file per target and those files are kept
# at quizzes/exam-parts/. That directory is the working record of who wrote
# which item, and the QA report cites it. Every stem, option and piece of
# feedback here is carried from those files word for word.
#
# THE SHAPE OF THIS FILE
#
#   title           what Canvas calls the quiz. It matches course.yaml.
#   description     HTML shown before a student starts. It carries the rules
#                   of the exam, so the student reads them before beginning.
#   ungraded        false. This is 20 percent of the course grade.
#   shuffle         true. Answer order is shuffled. No option refers to
#                   another option, so nothing breaks.
#   shuffle_answers the same value, under the name tools/cartridge.py reads.
#                   That path defaults to false when only `shuffle` is set.
#   attempts        1. A summative final.
#   allowed_attempts  the same number, under the name the QTI export reads.
#   show_correct_answers  true. The feedback is the point.
#   one_question_at_a_time, cant_go_back   both false. Open book. A student
#                   should be able to move around.
#   one_time_results  false. A student can reopen their feedback later.
#   omit_from_final_grade  false.
#   questions       a list. One entry per exam entry, in exam order.
#
# THERE IS NO time_limit KEY, on purpose. The exam has no time limit. The
# builder sends that setting only when this file names it, so leaving it out
# is what sets it. Dates are set on the Canvas side and are not here, because
# the course speaks in weeks, not dates.
#
# EVERY SCORED ITEM CARRIES
#
#   number          the item number from the blueprint coverage table. Fixed.
#   id              a short stable name. Never reused, never renumbered.
#   name            what Canvas shows as the question title.
#   type            multiple_choice on all thirty. canvas/build_course.py
#                   reads anything that is not text_only_question as multiple
#                   choice and would tolerate the key being absent, but
#                   tools/qti.py reads it directly: without it validate()
#                   reports "unknown type None" on every scored item and
#                   assessment() raises KeyError. The nine other quizzes in
#                   this directory all set it, so the exam sets it too.
#   points          1. Thirty items, thirty points, which is what course.yaml
#                   says the final exam is worth.
#   assesses        the coverage table's own words for what the item measures.
#   level           Recall, Apply, Analyze, Recognition or Analysis, from the
#                   same table.
#   difficulty      easy, medium or hard, from the same table. Item difficulty
#                   is not the corpus difficulty tier. An easy item can sit on
#                   a hard email, because it asks about one fact rather than
#                   the whole call.
#   artifact        the reserved email or the named constant the stem quotes,
#                   or "none" when the item sits on a reading instead.
#   section         where in the course a student learned this.
#   outcome         "none". The exam reports into no Canvas Outcome. Section 2
#                   of the blueprint sets that rule: a selected response exam
#                   is supporting evidence only, and the primary evidence for
#                   every course learning objective is a lab. The key is here
#                   because the export tooling requires one on every item.
#   text            the stem, as an HTML fragment.
#   answers         a list of four. Exactly one is correct. Every answer
#                   carries text, correct and feedback.
#
# WHERE THE CORRECT ANSWER SITS. Authored answer order is varied across the
# four slots: the key sits first in 8 items, second in 8, third in 8 and
# fourth in 6. That matters because the file reaches Canvas by more than one
# path and only one of them shuffles from this file's own settings.
# build_course.py reads `shuffle` and sends quiz[shuffle_answers].
# tools/cartridge.py reads `shuffle_answers`, which is why both keys are set
# below and set the same. tools/qti.py emits no shuffle metadata at all, so on
# that path the authored order is the delivered order and the spread above is
# the only protection there is. An exam whose key is first 26 times out of 30
# is answerable without reading it.
#
# THE SIX REFERENCE BLOCKS carry type: text_only_question. Six reserved emails
# hold two or three items each: 046, 049, 050, 052, 053 and 054. Rather than
# repeat one message in every stem, each is presented once in a block, and the
# items that read it follow directly under it. A block holds no answers and
# scores nothing, so the exam stays multiple choice only, which the build
# brief requires. Blueprint section 11 and decision D5 record that choice.
#
# A block never repeats an Authentication-Results block or a tool return that
# an item below it quotes. It carries the message: who sent it, to whom, the
# subject, the date, and what the gateway wrote on the way in. Each item then
# quotes the evidence its own read turns on.
#
# WHAT THE THIRTY COVER. Half sit on the four breadth topics and half on
# scenario reads from the agent and the corpus.
#
#   B1, AI and agentic workflows in IT and security operations   3 items
#   B2, the range of AI-assisted security use cases              4 items
#   B3, security operations components                           3 items
#   B4, the wider AI risk set                                    5 items
#   CLO1, extract header, authentication, sender and URL facts   6 items
#   CLO2, classify an email and validate the model's output      5 items
#   CLO4, judge whether guardrails reduce injection risk         4 items
#
# CLO3, CLO5 and CLO6 are not assessed here. A multiple choice item cannot
# show that a student built an agent, wrote a note another analyst could act
# on, or measured a batch. Those are seen in the labs.
#
# Difficulty runs 8 easy, 13 medium, 9 hard. The exam leans to the middle band
# on purpose: it is open book, so a recall-only item measures little.
#
# EVERY EMAIL IN THIS EXAM IS NEW TO THE STUDENT. The eleven reserved emails,
# 046 to 056, are not in the student corpus and no student has run their agent
# on one. Every scenario stem therefore describes a case as if the student's
# agent had just handled it and asks what the correct read is. The description
# says that once, at the top, so no stem repeats it. All eleven are used.
#
# EVERY ANSWER CARRIES ITS OWN FEEDBACK, right and wrong alike. That is 120
# pieces of feedback, and it is the rule in section 9 of the blueprint. The
# reason is the delivery mode. This course is fully asynchronous, and nobody
# walks a student through a missed question. Once the exam closes, the
# feedback a student reads on a wrong option is the only teaching that item
# will ever do. Feedback names the fact that decides the item, quotes the
# option's own words rather than a letter because answers are shuffled, runs
# to forty words or fewer, says what would have to be true for a wrong read to
# hold, points back to the week that taught the point, and answers no other
# item.
#
# THE KEY IS feedback, AND THE BUILDER WRITES IT TO CANVAS AS comments.
# Canvas also accepts answer_comments, answers HTTP 200 and stores nothing, so
# under that name all 120 would disappear with no error while the build
# reported success. Section 9 of the blueprint records the measurement.
#
# EIGHT ITEMS ARE APPROVED COPY. Section 7 of the blueprint writes items 3, 4,
# 8, 16, 17, 23, 27 and 28 out in full, with every option and every piece of
# feedback. Those eight are reproduced word for word and are not to be
# reworded. Two things follow from that rule and are recorded here rather than
# quietly fixed.
#
#   Items 8, 16, 17 and 28 call the student's week 3 code the "extractor".
#   That word appears in no page, notebook or glossary entry a student ever
#   sees: content/pages/w3-content.md defines the thing as a "parser" and
#   every notebook ships parse_eml. The other twelve places this file used it
#   now say parser. These four cannot, because they are approved copy, so the
#   exam carries both words until the blueprint is amended. Section 1 of the
#   blueprint defines "extractor" for the program manager, which is not a
#   student-facing definition, so blueprint section 6 rule 3 is not met.
#
#   Items 17 and 23 quoted a DMARC policy as "(p=quarantine)". No .eml in
#   instructor/exam-emails/ writes it that way; the real header reads
#   "dmarc=pass header.from=... policy.dmarc=quarantine". Both blocks now
#   quote the file. That is the one exception the build rule allows on
#   approved copy: the approved text quoted something the artifact does not
#   contain. On item 17 it mattered, because header.from is the only token in
#   the real header that shows the match its key turns on, and the sample had
#   deleted it. Neither change moves either item's measured reading grade,
#   because the tool excludes quoted headers.
#
# THE ORDER, AND WHY IT IS THIS ORDER
#
# The blueprint numbers the items 1 to 30, breadth first and then scenario.
# That numbering cannot also be the exam order, because a reference block has
# to sit directly above the items that read it, and the items sharing an email
# are not next to each other in the numbering. Items 3 and 22 both read email
# 049. Items 4, 19 and 26 all read email 052.
#
# Four of the six shared emails straddle the two halves. Email 049 carries one
# breadth item and one scenario item. So do 050 and 054. Email 052 carries one
# breadth item and two scenario items. Only 046 and 053 sit wholly inside the
# scenario half. So no order can keep both halves whole and keep every block
# with its items, unless a message is printed twice, and printing it twice is
# what the blocks exist to avoid.
#
# The order below turns that problem into the seam between the halves. It runs
# in three parts.
#
#   Part 1, entries 1 to 11. The eleven breadth items that stand on no shared
#   email, in blueprint order: 1, 2, 5, 6, 7, 8, 9, 10, 13, 14, 15.
#
#   Part 2, entries 12 to 24. The four shared emails whose items cross the
#   halves, in blueprint order of their breadth item: 049, 052, 054, 050.
#   Inside each group the block comes first, then the breadth item, then the
#   scenario items. These four groups are the bridge, and they carry the exam
#   from breadth work into scenario work one message at a time.
#
#   Part 3, entries 25 to 36. The remaining scenario items, in blueprint order
#   of the lowest number in each group: 16, 18, 20, then 046 with 21 and 27,
#   then 053 with 23 and 29, then 25, 28 and 30.
#
# Three things that order gets right. Every block sits directly above the
# items that read it. The breadth half still opens the exam and the scenario
# half still closes it, so a student reads them as halves. And the first item
# is item 1, an easy one, so nobody meets a hard item cold.
#
# One thing it costs. Four breadth items, 3, 4, 11 and 12, sit inside the
# bridge instead of with the other eleven. Each of those four is anchored on a
# reserved email, so the bridge is where they read best anyway: a student
# meets email 049 once and answers both of its questions while it is still in
# front of them.
#
# A second thing it costs, and how the directions handle it. The rule the
# order keeps is narrow: every block sits directly above the items that read
# it. The converse does not hold. Six items sit under a block they do not
# read: 16, 18 and 20 follow the 050 group, and 25, 28 and 30 follow the 053
# group. With one_question_at_a_time false the quiz is one scrolling page and
# a block has no visual end marker, so an earlier draft of the directions
# promised something the layout does not keep. Moving those six ahead of the
# first block would break the halves the order exists to preserve, so the
# directions were corrected instead: they now tell the student that every
# question names the email it asks about and to match that number to the
# reference carrying it. Every one of the six does name its own email in its
# own stem, and item 30 names a constant rather than an email.

title: Final exam
ungraded: false
shuffle: true
shuffle_answers: true
attempts: 1
allowed_attempts: 1
show_correct_answers: true
one_question_at_a_time: false
cant_go_back: false
one_time_results: false
omit_from_final_grade: false

description: |
  <p>Thirty questions, one point each, thirty points. You get one attempt.
  Most students finish in about ninety minutes. There is no time limit.</p>

  <h3>Open book, and nobody is watching</h3>

  <p>Use your notebooks, your exported files, the readings and the corpus.
  This exam is written so that having those open helps you only if you did
  the work.</p>

  <h3>The emails in this exam</h3>

  <p>These emails are new. You are not expected to have run your agent on
  them. Read the facts given and say what your agent should report.</p>

  <p>Six entries are marked Reference. A reference holds one email and
  nothing to answer. Every question names the email it asks about. Match
  that number to the reference that carries it. Some questions carry their
  own facts and use no reference at all.</p>

  <h3>What your score means</h3>

  <p>This exam is 20 percent of your course grade. Your score and the
  answers show as soon as you submit, and you can open them again later.</p>

  <p>Every answer carries feedback, right or wrong. It names the fact that
  decides the question and the week that taught it.</p>

questions:

  - number: 1
    id: exam-q01
    name: "Question 1. Which part of a security operations center"
    type: multiple_choice
    points: 0.75
    assesses: >-
      B3. Name the part of a security operations center a tool result points
      at
    level: Recall
    difficulty: easy
    artifact: "012"
    section: >-
      Week 1 reading, part one, the things you protect. The tool result is
      the one lookup_recipient() returns on email 012, which the week 5 lab
      runs.
    outcome: "none"
    text: |
      <p>Your week 5 loop ran all three tools on email 012. One step called
      <code>lookup_recipient</code>. What came back starts like this.</p>
      <pre><code>"address": "h.quintanilla@pellgrave.example",
      "name": "Hollis Quintanilla",
      "role": "Service Manager, Head Office Branch",
      "mailbox_type": "person"
      </code></pre>
      <p>The week 1 reading named ten parts of a security operations center.
      Which one is Hollis Quintanilla?</p>
    answers:
      - text: An asset
        correct: false
        feedback: >-
          An asset is a thing the company owns, like the payroll system.
          This line names a person instead, and the reading calls a person a
          user. See part one of the week 1 reading.
      - text: A user
        correct: true
        feedback: >-
          Right. A user is a person with an account at the company. The tool
          returned one person's record. See part one of the week 1 reading,
          the things you protect.
      - text: An endpoint
        correct: false
        feedback: >-
          An endpoint is the laptop or phone a person works on. This answer
          names the person, not the machine she types on. See part one of
          the week 1 reading.
      - text: A ticket
        correct: false
        feedback: >-
          A ticket is the record a team opens to track one piece of work.
          Your tool named who got the message, not the work. See part one of
          the week 1 reading.

  - number: 2
    id: exam-q02
    name: "Question 2. Your agent's job on the picture"
    type: multiple_choice
    points: 0.75
    assesses: >-
      B3. Where this course's agent sits between the alert and the ticket
    level: Recall
    difficulty: easy
    artifact: "none"
    section: Week 1 reading, part one, the picture and where your agent sits.
    outcome: "none"
    text: |
      <p>In the week 1 picture, a reported email becomes an alert, then a
      ticket. Your agent sits between those two stops.</p>
      <p>Which job on that picture is your agent's?</p>
    answers:
      - text: Deciding which reported mail is worth an alert of its own.
        correct: false
        feedback: >-
          That would be true if your agent picked which reports are worth an
          alert. It does not. A user clicks Report Phish, and the alert
          exists first. See part one of the week 1 reading.
      - text: Deciding whether the case is an incident the team must work.
        correct: false
        feedback: >-
          That would hold if your agent judged harm. It does not. A person
          decides that a case is an incident, and your agent stops at the
          note. See part one of the week 1 reading.
      - text: Reading the facts behind the alert and drafting the note.
        correct: true
        feedback: >-
          Right. Your agent reads the facts behind the alert and drafts the
          note that goes into the ticket. That is all it does. See part one
          of the week 1 reading.
      - text: Closing the ticket once nothing harmful has turned up.
        correct: false
        feedback: >-
          That would hold if your agent owned the ticket. It does not. The
          analyst closes it. Your agent hands over a note and stops. See
          part one of the week 1 reading.

  - number: 5
    id: exam-05-what-makes-it-agentic
    name: "Question 5. What makes your loop agentic"
    type: multiple_choice
    points: 0.75
    assesses: B1, what makes a workflow agentic
    level: Recall
    difficulty: easy
    artifact: "decisive_stop()"
    section: >-
      Week 1 reading, part two, agentic workflows at work. Week 5 reading,
      the agent picks its next tool from what it just read, and the stop
      condition is a rule in your code.
    outcome: "none"
    text: |
      <p>Your week 5 loop asks the model which tool to run next. Your code runs
      that tool. Then <code>decisive_stop()</code> says whether the run
      ends.</p>
      <p>What makes this an agentic workflow?</p>
    answers:
      - text: It sends more than one request to the model.
        correct: false
        feedback: >-
          Two requests are not the test. Your week 2 code could call twice
          on one email and still pick no next step. Week 1 reading, part
          two.
      - text: It calls tools that look up facts for it.
        correct: false
        feedback: >-
          Week 4 gave you tools and one round, and that was not a loop yet.
          Choosing the next tool is what week 5 added. Week 1 reading, part
          two.
      - text: It writes its verdict in a fixed shape.
        correct: false
        feedback: >-
          A fixed shape came from week 2 and it never chose anything. The
          shape helps your code read the answer. Week 1 reading, part two.
      - text: It picks its own next step and then acts.
        correct: true
        feedback: >-
          Right. The loop reads the last result and names the tool it wants
          next. <code>decisive_stop()</code> sets the limit around that
          choice. Week 1 reading, part two.

  - number: 6
    id: exam-06-what-it-hands-back
    name: "Question 6. What the password tool hands back"
    type: multiple_choice
    points: 0.75
    assesses: B1, AI in IT work outside security
    level: Apply
    difficulty: medium
    artifact: "none"
    section: >-
      Week 1 reading, part two. The table of three kinds and what each hands
      back, and the password reset example in agentic workflows at work.
    outcome: "none"
    text: |
      <p>The Pellgrave help desk runs a tool on password tickets. It reads the
      ticket, checks the account, checks the device, resets the password, and
      closes the ticket.</p>
      <p>What does this tool hand back?</p>
    answers:
      - text: A decision and an action.
        correct: true
        feedback: >-
          Right. The password is reset and the ticket is closed. That result
          is a decision plus an action, which is what this kind of tool
          returns. Week 1 reading, part two.
      - text: A number or a label.
        correct: false
        feedback: >-
          A number or a label is what the ticket urgency tool gives the help
          desk. This tool changes a password instead. Week 1 reading, part
          two.
      - text: New text for a person to edit.
        correct: false
        feedback: >-
          New text is what the change request draft gives a technician.
          Nothing here is written for a person to edit. Week 1 reading, part
          two.
      - text: A ticket for a person to work.
        correct: false
        feedback: >-
          The patch tool opens tickets. This one closes the ticket it
          started from, so no new ticket is handed to anyone. Week 1
          reading, part two.

  - number: 7
    id: exam-q07-b2-name-the-use-case
    name: "Question 7. Which job is this"
    type: multiple_choice
    points: 0.75
    assesses: B2, name the use case
    level: Recall
    difficulty: easy
    artifact: "none"
    section: >-
      Week 7 reading, part three, two jobs where the tool writes a draft.
      Also the week 7 self-check, items 5 to 8.
    outcome: "none"
    text: |
      <p>Devin Crowmarden has a folder of ticket files from last quarter. He
      wants every ticket number pulled out into one list. He will read what he
      gets back. Then he will run it on a copy.</p>
      <p>Which of the seven use cases from week 7 is that?</p>
    answers:
      - text: Documentation
        correct: false
        feedback: >-
          Documentation drafts a note or a summary from facts already
          recorded. Nothing here is being written up. Devin runs what he
          gets back. Week 7 reading, part three.
      - text: Scripting help
        correct: true
        feedback: >-
          Right. He gets code back, reads it, then runs it on a copy.
          Scripting help needs the shape of the data and what he wants out.
          Week 7 reading, part three.
      - text: Log review
        correct: false
        feedback: >-
          Log review hands back the few lines worth a look. Devin already
          knows what he wants out of these files. Week 7 reading, part
          three.
      - text: Incident response support
        correct: false
        feedback: >-
          That job drafts a timeline during an incident, from evidence
          already collected. Nothing is open here. Week 7 reading, part
          three.

  - number: 8
    id: exam-q08-b2-log-review
    name: "Question 8. Moving the agent to firewall logs"
    type: multiple_choice
    points: 0.75
    assesses: B2, what changes for log review
    level: Analyze
    difficulty: hard
    artifact: "none"
    section: >-
      Week 3 reading, the model is not a detector, and the same move on a
      log line. The seven jobs are week 7 reading, part three.
    outcome: "none"
    text: |
      <p>You want your agent to review firewall logs instead of email. Week 3
      said the model is a judgment layer over facts you pull out first. Which
      part of your agent changes the most?</p>
    answers:
      - text: The extractor that reads headers, senders and links.
        correct: true
        feedback: >-
          Right. A log line has no header, no sender and no link. The
          extractor is rebuilt first.
      - text: The four-key output schema.
        correct: false
        feedback: >-
          The four keys still fit. A log line can still carry a verdict, a
          category, a confidence and indicators.
      - text: The four-step cap on the loop.
        correct: false
        feedback: >-
          The cap exists for cost and runaway loops. It does not care what
          the input is.
      - text: The confidence floor of 0.7.
        correct: false
        feedback: >-
          The floor sends unsure cases to a person. That rule holds for logs
          too.

  - number: 9
    id: exam-q09-b2-documentation
    name: "Question 9. Which note line is that job"
    type: multiple_choice
    points: 0.75
    assesses: B2, the documentation use case
    level: Apply
    difficulty: medium
    artifact: "none"
    section: >-
      Week 7 reading, part one, why the six lines never move, and the last
      line is not for you. The documentation job is part three.
    outcome: "none"
    text: |
      <p>Week 7 called documentation a job that writes a draft from facts
      already recorded. The ticket owner reads it first.</p>
      <p>Your triage note holds six lines.</p>
      <pre><code>Verdict:
      Confidence:
      Indicators:
      Recommended action:
      Escalate:
      Summary:</code></pre>
      <p>Which line is that job?</p>
    answers:
      - text: The indicators, the short facts that sit behind the verdict.
        correct: false
        feedback: >-
          The indicators are the facts a write-up starts from. Documentation
          needs facts already recorded. It does not go and find them. Week 7
          reading, part three.
      - text: The verdict, which is either malicious or benign.
        correct: false
        feedback: >-
          The verdict is the judgment your agent made. Documentation writes
          up a decision that has already been made. Week 7 reading, part
          three.
      - text: The summary, two sentences for the reporter to read.
        correct: true
        feedback: >-
          Right. The summary is written from facts the note already holds,
          in plain words, and a person reads it before anyone acts. Week 7
          reading, part one, the last line is not for you.
      - text: The recommended action, which is one of five set values.
        correct: false
        feedback: >-
          That line holds one set value, and it has to fit the verdict.
          Nothing is drafted there. Week 7 reading, part one, why the six
          lines never move.

  - number: 10
    id: exam-q10-b2-tool-gap
    name: "Question 10. What no tool returns"
    type: multiple_choice
    points: 0.75
    assesses: B2, what the tool set cannot supply
    level: Analyze
    difficulty: hard
    artifact: "check_sender_reputation, check_urls, lookup_recipient"
    section: >-
      Week 4 reading, why the three tools are plain Python. The
      vulnerability research job is week 7 reading, part three.
    outcome: "none"
    text: |
      <p>Pellgrave wants your agent to do vulnerability research instead of
      phishing. Your three tools return these keys.</p>
      <pre><code>check_sender_reputation(sender)
          status, match_level, new_domain, first_seen, messages_90d,
          prior_reports, last_report_verdict, last_report_date, campaign_tag,
          notes, and domain or address
      check_urls(hosts)
          one entry per host: allowlisted, blocklisted, internal or unlisted
      lookup_recipient(address)
          address, name, role, mailbox_type, executive, handles_payments,
          chronic_reporter, report_count_90d, true_positive_count_90d,
          campaign_tags</code></pre>
      <p>Which fact does that job need first that no tool here returns?</p>
    answers:
      - text: Whether the recipient handles payments.
        correct: false
        feedback: >-
          <code>lookup_recipient</code> returns that now, as
          <code>handles_payments</code>. It is also a fact about one person,
          not about the machines you run. Week 4 reading, why the three
          tools are plain Python.
      - text: Whether a link host is on the blocklist.
        correct: false
        feedback: >-
          <code>check_urls</code> returns that now. It marks every host
          allowlisted, blocklisted, internal or unlisted. Week 4 reading,
          why the three tools are plain Python.
