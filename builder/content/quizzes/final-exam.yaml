  - number: 22
    id: exam-q22-049-auth-versus-ask
    name: "Question 22. Every check passed, and the account changed"
    type: multiple_choice
    points: 0.75
    assesses: CLO2, classify an email and validate the model's output
    level: Analysis
    difficulty: easy
