        feedback: >-
          The cap is four and this run used three, so a tool ran out before a
          step did. step_cap only fires when steps run out with a tool still
          unused. See the week 5 reading.
      - text: "<code>decisive_benign</code>"
        correct: false
        feedback: >-
          decisive_benign needs a trusted sender and a trusted link host to
          agree. Here the sender is unknown and the host is on no list, so
          nothing was settled. See the week 5 reading.
      - text: "<code>internal_sender</code>"
        correct: false
        feedback: >-
          internal_sender means the mail never left the organization. This
          sender is unknown rather than internal. See the week 5 reading.

  - number: 32
    id: exam-q32-clo3-stop-in-code
    name: Question 32. Why the stop condition is code and not a prompt
    type: multiple_choice
    points: 0.75
    assesses: CLO3. Explain why the bounded loop's stop rule lives in the student's code
    level: Comprehension
    difficulty: medium
    artifact: none
    section: >-
      Week 5 reading, the rule lives in your code, not in the model, and the
      measurement quoted there.
    outcome: CLO3
    text: |
      <p>The week 5 reading gives one measured reason for writing the stop
      rule in Python instead of asking the model to stop when it has enough.
      Which reason is it?</p>
    answers:
      - text: >-
          A model left to decide kept calling tools after it already had its
          answer, and ended for the right reason far less often
        correct: true
        feedback: >-
          Right. Left to itself it produced the correct whole path 25 times in
          60. With the rule in code, runs ended for the right reason 136 times
          in 138. See the week 5 reading.
      - text: The model cannot read a tool result well enough to judge one
        correct: false
        feedback: >-
          It reads them well. The measured weakness is knowing when to stop,
          not knowing what it just read. See the week 5 reading.
      - text: Writing the rule in code makes each run cost fewer tokens
        correct: false
        feedback: >-
          Fewer steps do cost less, but that is a side effect. The reason the
          reading gives is that runs end for the right reason. See the week 5
          reading.
      - text: Canvas cannot grade a stop rule the model wrote
        correct: false
        feedback: >-
          Grading is not the reason. The reason is a measurement of how often
          the run ended correctly. See the week 5 reading.

  - number: 33
    id: exam-q33-clo3-step-cap
    name: Question 33. What the step cap is for
    type: multiple_choice
    points: 0.75
    assesses: CLO3. Say what bounds a loop when nothing settles the case
    level: Comprehension
    difficulty: easy
    artifact: none
    section: >-
      Week 5 reading, the last two stop reasons say the run ran out of room.
      Week 5 lab, MAX_STEPS.
    outcome: CLO3
    text: |
      <p>An email arrives that no tool settles. Every check comes back
      unknown. What does the step cap do?</p>
    answers:
      - text: It ends the run after a fixed number of steps so the loop cannot run on
        correct: true
        feedback: >-
          Right. The first three stop reasons come from a settled case. The
          last two say the run ran out of room, and the cap is what supplies
          that room. See the week 5 reading.
      - text: It makes the model answer with lower confidence
        correct: false
        feedback: >-
          The cap ends the run. It does not change what the model says about
          how sure it is. Confidence is week 6. See the week 5 reading.
      - text: It marks the email malicious once the steps run out
        correct: false
        feedback: >-
          Running out of steps settles nothing. step_cap says the run ended
          without an answer, which is exactly the case a person should see.
          See the week 5 reading.
      - text: It stops the agent calling the same tool twice
        correct: false
        feedback: >-
          That is what tracking used tools does. The cap counts steps, not
          repeats. See the week 5 reading.

  - number: 34
    id: exam-q34-clo3-next-tool
    name: Question 34. Which tool the loop should call next
    type: multiple_choice
    points: 0.75
    assesses: CLO3. Choose the next tool from what the run already knows
    level: Application
    difficulty: medium
    artifact: none
    section: >-
      Week 4 reading, what each of the three tools returns. Week 5 reading, one
      step is three actions, and the agent picks its next tool from what it
      just read.
    outcome: CLO3
    text: |
      <p>A run is one step in. This is everything it knows.</p>
      <pre><code>from:  billing@slatemoor.example   (sender reputation: unknown)
      body:  one link, https://slatemoor-invoices.example/pay
      to:    a.okonkwo@pellgrave.example
      </code></pre>
      <p>Two tools are still unused. Which one should the loop call next, and
      why?</p>
    answers:
      - text: >-
          <code>check_urls</code>, because there is a link and nothing yet says
          where it goes
        correct: true
        feedback: >-
          Right. The next step is the one that can still change the verdict,
          and an unchecked link is the open question here. See the week 5
          reading.
      - text: >-
          <code>lookup_recipient</code>, because the recipient decides how
          serious it is
        correct: false
        feedback: >-
          Who received it matters for priority, but it cannot settle whether
          the mail is malicious. The unchecked link can. See the week 4 and
          week 5 readings.
      - text: >-
          <code>check_sender_reputation</code> again, because unknown is not an
          answer
        correct: false
        feedback: >-
          Calling the same tool again returns the same record. A step that
          adds nothing is the step the week 5 reading tells you to notice. See
          the week 5 reading.
      - text: Neither, because an unknown sender is enough to call it malicious
        correct: false
        feedback: >-
          Unknown means no history, not bad history. Judging on that alone is
          the mistake week 3 names. See the week 3 reading.

  - number: 35
    id: exam-q35-clo5-summary-audience
    name: Question 35. Which line is written for the person who reported it
    type: multiple_choice
    points: 0.75
    assesses: CLO5. Identify which part of a triage note its non-analyst reader depends on
    level: Comprehension
    difficulty: easy
    artifact: none
    section: >-
      Week 7 reading, why the six lines never move, and the last line is not
      for you.
    outcome: CLO5
    text: |
      <p>A triage note has six lines. Priya Castellanos in accounts payable
      reported the email. She is not an analyst. Which line is written for
      her?</p>
    answers:
      - text: Summary
        correct: true
        feedback: >-
          Right. The summary is two sentences saying whether anything happened
          to her and what happens now. See the week 7 reading, the last line is
          not for you.
      - text: Indicators
        correct: false
        feedback: >-
          Indicators are the short facts behind the verdict, written for an
          analyst. Write "spf softfail" to Priya and she has learned nothing.
          See the week 7 reading.
      - text: Confidence
        correct: false
        feedback: >-
          Confidence is a number from 0 to 1 saying how sure the model is. It
          tells the reporter nothing about what happens next. See the week 7
          reading.
      - text: Verdict
        correct: false
        feedback: >-
          The verdict is one word, malicious or benign. It is the finding, not
          the explanation the reporter needs. See the week 7 reading.

  - number: 36
    id: exam-q36-clo5-indicator-not-in-facts
    name: Question 36. An indicator that names a host the facts never held
    type: multiple_choice
    points: 0.75
    assesses: CLO5. Judge whether a written note is supported by the evidence behind it
    level: Analysis
    difficulty: hard
    artifact: none
    section: >-
      Week 6 reading, part 2, hallucination, and check_against_facts(), which
      you wrote in TODO 2 of the week 6 lab. Week 7 reading, the six lines.
    outcome: CLO5
    text: |
      <p>Your agent writes this note. The facts block for the email listed one
      link host, <code>slatemoor-invoices.example</code>, and no others.</p>
      <pre><code>Verdict:     malicious
      Indicators:  spf softfail; link host cindermill-payments.example on the block list
      Escalate:    yes
      </code></pre>
      <p>What is wrong with this note?</p>
    answers:
      - text: >-
          An indicator names a host that was never in the facts, so the note
          cites evidence the run did not have
        correct: true
        feedback: >-
          Right. This is the hallucination case week 6 names, and
          check_against_facts() is the control that catches it. A note is only
          as good as the facts under it. See the week 6 reading, part 2.
      - text: The verdict and the escalate line disagree
        correct: false
        feedback: >-
          They agree. A malicious verdict with escalate yes is consistent. The
          problem is in the indicators. See the week 6 reading, part 2.
      - text: Two indicators is too few to support a malicious verdict
        correct: false
        feedback: >-
          The course sets no minimum count. One indicator drawn from the facts
          beats six invented ones. See the week 7 reading.
      - text: Nothing is wrong, because spf softfail is a real finding
        correct: false
        feedback: >-
          The softfail is real. The second indicator names a host the facts
          never held, and that is enough to send the note back. See the week 6
          reading, part 2.

  - number: 37
    id: exam-q37-clo5-action-vs-escalate
    name: Question 37. Recommended action and escalate are not the same line
    type: multiple_choice
    points: 0.75
    assesses: CLO5. Distinguish what happens to the email from whether a person must see it
    level: Comprehension
    difficulty: medium
    artifact: none
    section: Week 7 reading, why the six lines never move, and when a case goes to a person.
    outcome: CLO5
    text: |
      <p>A note carries both a Recommended action line and an Escalate line.
      What is the difference between them?</p>
    answers:
      - text: >-
          Recommended action says what should happen to the email. Escalate
          says whether a person has to look before it happens
        correct: true
        feedback: >-
          Right. One names the outcome, the other names who signs it off. See
          the week 7 reading, the six lines, and week 6 on when a case goes to
          a person.
      - text: Recommended action is for the reporter, escalate is for the analyst
        correct: false
        feedback: >-
          The line written for the reporter is the summary. Both of these are
          for whoever works the ticket. See the week 7 reading.
      - text: They always agree, so either one can be dropped
        correct: false
        feedback: >-
          They often differ. "Delete the message" with escalate no is a normal
          note, and so is the same action with escalate yes. See the week 7
          reading.
      - text: Escalate is set by your code and recommended action by the model
        correct: false
        feedback: >-
          Both come out of one result and write_note() places them. Who sets
          which is not the difference. See the week 7 reading.

  - number: 38
    id: exam-q38-clo6-fp-fn
    name: Question 38. Which error this batch made
    type: multiple_choice
    points: 0.75
    assesses: CLO6. Read a batch score and name the error type
    level: Application
    difficulty: medium
    artifact: none
    section: >-
      Week 7 reading, the batch and the score report. Week 7 lab, TODO 2,
      score_batch().
    outcome: CLO6
    text: |
      <p>Your batch run over twenty emails scored like this.</p>
      <pre><code>Correct calls:     17 of 20
      False positives:   0
      False negatives:   3
      </code></pre>
      <p>What did the agent get wrong?</p>
    answers:
      - text: It called three malicious emails benign
        correct: true
        feedback: >-
          Right. A false negative is a malicious email called benign, and
          three of them went out as safe. See the week 7 reading and TODO 2 in
          the week 7 lab.
      - text: It called three benign emails malicious
        correct: false
        feedback: >-
          That is a false positive, and this run had none. Check which counter
          holds which error. See TODO 2 in the week 7 lab.
      - text: Three emails did not finish, so they had no verdict
        correct: false
        feedback: >-
          A row with no verdict is reported on its own line. These three
          produced a verdict and the verdict was wrong. See the week 7 lab
          score report.
      - text: Nothing, because 17 of 20 is above the confidence floor
        correct: false
        feedback: >-
          The confidence floor is about a single answer, not a batch score.
          Three malicious emails were called safe. See the week 6 and week 7
          readings.

  - number: 39
    id: exam-q39-clo6-accuracy-is-not-enough
    name: Question 39. Two batches with the same accuracy
    type: multiple_choice
    points: 0.75
    assesses: CLO6. Explain why one accuracy number does not describe a batch
    level: Analysis
    difficulty: hard
    artifact: none
    section: >-
      Week 7 reading, the batch and what the score report is for. Week 7
      self-check, items on false positives and false negatives.
    outcome: CLO6
    text: |
      <p>Two runs over the same twenty emails both score 17 of 20.</p>
      <pre><code>Run A   false positives 3   false negatives 0
      Run B   false positives 0   false negatives 3
      </code></pre>
      <p>Why does the difference matter more than the shared accuracy?</p>
    answers:
      - text: >-
          Run B let three malicious emails through, while run A only sent three
          safe ones for review
        correct: true
        feedback: >-
          Right. The same accuracy hides opposite outcomes. One costs an
          analyst time, the other leaves an attack in an inbox. See the week 7
          reading.
      - text: Run A used more tokens, so it cost more to produce the same score
        correct: false
        feedback: >-
          Nothing here says anything about tokens, and cost is not what
          separates these two runs. See the week 7 reading.
      - text: Run B is better, because false negatives are easier to correct later
        correct: false
        feedback: >-
          A false negative is the harder one to correct, because nobody is
          looking at that email any more. See the week 7 reading.
      - text: They are the same, because accuracy is the number the rubric asks for
        correct: false
        feedback: >-
          The rubric asks for the split as well as the rate, and this is why.
          See the week 7 reading and the week 7 lab score report.

  - number: 40
    id: exam-q40-clo6-where-humans-stay
    name: Question 40. Where human review stays required
    type: multiple_choice
    points: 0.75
    assesses: CLO6. Recommend where a person still has to review, given a measured batch
    level: Evaluation
    difficulty: hard
    artifact: none
    section: >-
      Week 7 reading, what the measurement is for. Week 6 reading, part 1, the
      confidence floor, and part 2, overreliance and automation bias.
    outcome: CLO6
    text: |
      <p>You measured your agent over twenty emails. It scored 17 of 20, and
      all three misses were malicious emails called benign. You are asked
      where a person still has to review.</p>
      <p>Which recommendation does your own measurement support?</p>
    answers:
      - text: >-
          A person reviews every benign call, because that is where all three
          misses landed
        correct: true
        feedback: >-
          Right. The measurement says where the agent fails, and it failed only
          on emails it called benign. Review follows the evidence. See the week
          7 reading.
      - text: >-
          A person reviews every malicious call, because those are the serious
          ones
        correct: false
        feedback: >-
          The agent got every malicious call right in this run. Reviewing them
          spends attention where your measurement found no errors. See the week
          7 reading.
      - text: No review is needed, because 85 percent is a passing score
        correct: false
        feedback: >-
          Three malicious emails reached inboxes. Treating a batch score as a
          release decision is the overreliance the week 6 reading names. See
          the week 6 reading, part 2.
      - text: >-
          A person reviews a random sample, because sampling is how accuracy is
          measured
        correct: false
        feedback: >-
          A random sample is how you estimate a rate you do not know. You
          already know where this agent fails, so review can go there. See the
          week 7 reading.
