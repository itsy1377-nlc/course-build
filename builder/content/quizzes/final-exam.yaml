    outcome: CLO2
    text: |
      <p>Email 049 comes from <code>accounts@redcedar-safety.example</code>.
      Your headers and tools return this.</p>
      <pre><code>Authentication-Results: mx.pellgrave.example;
        spf=pass smtp.mailfrom=redcedar-safety.example;
        dkim=pass header.d=redcedar-safety.example header.s=k1
          header.i=@redcedar-safety.example;
        dmarc=pass header.from=redcedar-safety.example policy.dmarc=none
      check_sender_reputation -&gt; status: unknown, new_domain: true, first_seen: 2026-04-28
      Body: "Please note our updated ACH instructions: payments now go to the account below."</code></pre>
      <p>What should your agent report?</p>
    answers:
      - text: >-
          Benign. All three checks passed, so the message really came from
          Redcedar.
        correct: false
        feedback: >-
          Passing checks show the domain signed its own mail. Anyone who
          buys a domain can publish those records. They say nothing about
          the ask. Week 3 reading.
      - text: >-
          Benign. The gateway scan result is clean, so the message already
          passed a check.
        correct: false
        feedback: >-
