# Week 2 self-check. Six questions, 12 points, low stakes.
#
# THE SHAPE OF THIS FILE
#
#   title           what Canvas calls the quiz
#   description     HTML shown before a student starts. It carries the scoring
#                   rule, so the student reads it before and after every attempt.
#   ungraded        false. This one counts, in the Self-Checks group, which is
#                   8 percent of the course grade across all seven weeks.
#   shuffle         false. The options are read in order, so they stay in order.
#   attempts        -1 means unlimited.
#   allowed_attempts  the same number, under the name the QTI export reads.
#   questions       a list. One entry per question.
#
# EVERY QUESTION CARRIES
#
#   id              a short stable name. Never reused, never renumbered.
#   name            what Canvas shows as the question title.
#   type            multiple_choice for all six.
#   points          2. Six questions, twelve points.
#   section         which page or notebook section the question comes from.
#   outcome         "none". Self-checks report into no Canvas Outcome. The
#                   graded evidence for CLO2 is the week 2 lab rubric,
#                   criterion 2, which the alignment matrix records as the
#                   primary evidence. A second reporter here would contradict
#                   it. The key is present because the export tooling requires
#                   one on every item.
#   text            the stem, as an HTML fragment.
#   answers         a list. Every answer carries text, correct, and feedback.
#
# EVERY ANSWER CARRIES ITS OWN FEEDBACK, right and wrong alike. Feedback names
# the section to reopen, because the attempts are unlimited and the point of
# the quiz is to send a student back to the right paragraph.
#
# ITEM COVERAGE. Items 1, 4, 5 and 6 sit directly on this week's objectives.
# Items 2 and 3 are the two load failures a student is most likely to meet
# alone, late, with nobody to ask.

title: Week 2 self-check
ungraded: false
shuffle: false
attempts: -1
allowed_attempts: -1

description: |
  <p>Six short questions on week 2. They take about ten minutes.</p>

  <h3>What your score means</h3>

  <p>This quiz is worth 12 points. You may take it as many times as you like,
  and your highest score is the one that counts.</p>

  <p>Every answer, right or wrong, tells you which section to reopen. Use
  those names. Missing one twice is a sign to go back and read, not a sign to
  guess again.</p>

  <p>Take it after the reading and the lab. It is written to check what the
  lab taught you, not to teach it.</p>

questions:

  - id: w2-q1
    name: Question 1. The four keys
    type: multiple_choice
    points: 2
    section: "Week 2 reading, part 1, why a sentence is not an answer"
    outcome: "none"
    text: |
      <p>Which four key names does the course output schema require?</p>
    answers:
      - text: "verdict, category, confidence, indicators"
        correct: true
        feedback: >-
          Correct. Those four, spelled that way, on every answer. Week 2
          reading, part 1, why a sentence is not an answer.
      - text: "verdict, reason, score, evidence"
        correct: false
        feedback: >-
          No. Three of those names are close in meaning and wrong in text. The
          schema checks the name, not the meaning. Week 2 reading, part 1, why a
          sentence is not an answer.
      - text: "subject, sender, body, links"
        correct: false
        feedback: >-
          No. Those are parts of the email going in. The four keys are the
          answer coming back. Week 2 reading, part 1, why a sentence is not an answer.
      - text: "malicious, benign, spam, unknown"
        correct: false
        feedback: >-
          No. Two of those are values the verdict key can hold. They are not
          key names. Week 2 reading, part 1, why a sentence is not an answer.

  - id: w2-q2
    name: Question 2. A stop reason of length
    type: multiple_choice
    points: 2
    section: "Week 2 reading, part 2, a wrong shape is a normal condition"
    outcome: "none"
    text: |
      <p>Your call comes back with an empty answer and a stop reason of
      <code>length</code>. What happened, and what should your code do
      next?</p>
    answers:
      - text: The model reached the answer limit before usable JSON arrived. Record the failure and ask for one complete JSON object with no words around it.
        correct: true
        feedback: >-
          Correct. Record the failed try. The retry says: Return one complete
          JSON object with no words before or after it. Week 2 reading, part 2,
          a wrong answer is a normal condition.
      - text: The email was too long to classify. Skip it and move to the next one.
        correct: false
        feedback: >-
          No. The limit that ran out is on the answer, not on the email. And
          skipping loses the record a grader needs. Week 2 reading, part 2, a wrong
          shape is a normal condition.
      - text: The model refused to answer. Report it to your instructor.
        correct: false
        feedback: >-
          No. A refusal is text. This reply is empty because generation
          stopped. Week 2 reading, part 2, a wrong shape is a normal condition.
      - text: The answer is fine. An empty string still loads as JSON.
        correct: false
        feedback: >-
          No. An empty string is not JSON, and the load raises an error. Week
          2 reading, a wrong shape is a normal condition.

  - id: w2-q3
    name: Question 3. Stripping the reasoning block
    type: multiple_choice
    points: 2
    section: "Week 2 reading, part 2, a wrong shape is a normal condition"
    outcome: "none"
    text: |
      <p>Why does the model's reasoning block have to come off before you load
      the answer?</p>
    answers:
      - text: Because the reasoning text sits around the JSON, so the load fails on it.
        correct: true
        feedback: >-
          Correct. The load needs JSON and nothing else. Anything wrapped
          around it breaks the parse. Week 2 reading, part 2, a wrong shape is a
          normal condition.
      - text: Because reading it would tell you the answer before the schema check runs.
        correct: false
        feedback: >-
          No. Reading it is harmless. The problem is mechanical: extra
          characters break the load. Week 2 reading, part 2, a wrong shape is a normal
          condition.
      - text: Because it is private and you are not allowed to see it.
        correct: false
        feedback: >-
          No. Nothing here is private. It is text the model wrote to itself,
          and it is in your way. Week 2 reading, part 2, a wrong shape is a normal
          condition.
      - text: Because it makes the file too large to attach.
        correct: false
        feedback: >-
          No. Size is not the issue. The load is. Week 2 reading, part 2, a wrong
          shape is a normal condition.

  - id: w2-q4
    name: Question 4. Stop on acceptance
    type: multiple_choice
    points: 2
    section: "Week 2 sidebar, parts 2C and 2D"
    outcome: "none"
    text: |
      <p>Your reply loaded into a dictionary, but
      <code>schema_errors()</code> returned one problem. What keeps the retry
      loop going?</p>
    answers:
      - text: Assign the dictionary to answer as soon as json.loads() succeeds.
        correct: false
        feedback: >-
          No. That stops on loading, before the schema problem can cause a
          retry. Week 2 sidebar, part 2C, load a candidate, then accept it.
      - text: Keep answer as None, and assign the candidate to it only when the problem list is empty.
        correct: true
        feedback: >-
          Correct. The loop condition changes only after the check accepts the
          candidate. Week 2 sidebar, parts 2C and 2D.
      - text: Return the dictionary and let the next email repair it.
        correct: false
        feedback: >-
          No. That hands back an answer the checker rejected. Week 2 lab, TODO
          2, classify_email.
      - text: Set answer to the problem list so the loop has something to read.
        correct: false
        feedback: >-
          No. A nonempty list would also make answer stop being None. Keep the
          accepted answer and the problem list in separate variables. Week 2
          sidebar, part 2D.

  - id: w2-q5
    name: Question 5. What a retry has to add
    type: multiple_choice
    points: 2
    section: "Week 2 reading, part 2, the retry"
    outcome: "none"
    text: |
      <p>Your first try failed the schema check. What must the second request
      add to be worth making?</p>
    answers:
      - text: The problems your check reported, in plain words.
        correct: true
        feedback: >-
          Correct. In the controlled range test, all 24 replies passed with
          the problem added and none passed after a bare re-ask. Week 2
          reading, part 2, the retry.
      - text: A higher temperature, so the model answers differently.
        correct: false
        feedback: >-
          No. That changes variation. It does not tell the model what failed
          the check. Week 2 reading, part 2, the retry.
      - text: The same prompt again. Models often get it right on a second pass.
        correct: false
        feedback: >-
          No. In the course range test, every bare re-ask repeated 0.95. The
          exact problem was the active ingredient. Week 2 reading, part 2, the
          retry.
      - text: A note asking the model to try harder this time.
        correct: false
        feedback: >-
          No. That is pressure, not information. Name the exact problem
          instead. Week 2 reading, part 2, the retry.

  - id: w2-q6
    name: Question 6. Loads cleanly, fails the range
    type: multiple_choice
    points: 2
    section: "Week 2 reading, part 1, what a schema buys you"
    outcome: "none"
    text: |
      <p>An answer is valid JSON, has all four keys, and reports
      <code>confidence: 0.95</code>. Why does it fail the week 2 check?</p>
    answers:
      - text: JSON does not allow decimal numbers.
        correct: false
        feedback: >-
          No. 0.95 is valid JSON. The load and the schema ask different
          questions. Week 2 reading, part 1, what a schema buys you.
      - text: The week 2 reporting rule accepts confidence only from 0.0 to 0.9.
        correct: true
        feedback: >-
          Correct. The number loads, then the range check rejects it. That
          reports a contract mismatch, not a change in certainty. Week 2
          reading, part 1, what a schema buys you.
      - text: A confidence above 0.9 proves the verdict is wrong.
        correct: false
        feedback: >-
          No. Confidence is the model's report, not a fact about the verdict.
          Week 2 reading, part 1, why a sentence is not an answer.
      - text: The checker accepts only whole numbers.
        correct: false
        feedback: >-
          No. Decimal numbers are allowed when they sit inside the declared
          range. Week 2 reading, part 1, what a schema buys you.
