      Part 1 quotes one line from your own exported file and names the temperature that produced it
    points: 6
    levels:
      - description: >-
          Full. Part 1 quotes one line from your own exported file and names the temperature that produced it
        points: 6
      - description: >-
          Partly. One part of this is here and another is missing, or a value is given without the run it came from.
