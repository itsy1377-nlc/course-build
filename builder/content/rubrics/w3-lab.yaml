# Week 3 lab rubric. Four criteria, 100 points, four levels each.
#
# THE SHAPE OF THIS FILE
#
#   title       what Canvas calls the rubric
#   points      the total. Every lab in this course is 100, which is what makes
#               the seven labs weigh equally inside the Labs group.
#   criteria    a list. One entry per criterion, in the order a grader reads.
#
# EVERY CRITERION CARRIES
#
#   description       the criterion name, as the week 3 spec and the alignment
#                     matrix word it. Not reworded here.
#   long_description  what earns full credit, in the words the assignment page
#                     shows the student. The two must stay identical. A
#                     criterion with no Outcome link adds one sentence saying
#                     which week expectation it measures.
#   points            the criterion's share of the 100. Four criteria at 25.
#   outcome           the key of the Canvas Outcome this criterion reports
#                     into, from content/course.yaml. Present on one criterion
#                     only. See the note below on the Canvas limit.
#   levels            a list, highest first. The top level equals points.
#
# WHY ONLY ONE CRITERION CARRIES AN OUTCOME LINK. Canvas allows a given Outcome
# to align to at most one criterion in a rubric. A rubric that aligns the same
# Outcome twice is refused, and the refusal is silent: the API answers HTTP 200
# and creates nothing at all. Measured against the live instance on 4 September
# 2026, one link succeeds and two or more produce no rubric. That silence
# already cost the week 1 lab its rubric.
#
# The week 3 spec linked criteria 2, 3 and 4 to CLO1, which is three links to
# one Outcome and so would create no rubric at all. Criterion 2 carries the
# link. CLO1 reads "Extract the header, authentication, sender, and URL facts an
# AI model needs to judge a suspicious email", and criterion 2 is the only
# criterion here that reads the extracted facts themselves: the facts block sent
# with each email, its fact groups, its labels, its order and its values.
# Criterion 3 measures whether both runs were recorded and reported, and
# criterion 4 measures whether the student reported what their own run did. The
# alignment matrix names "you reported what you saw" as a non-CLO expectation,
# so both are written as week expectations and say so. Criterion 1 measures
# submission completeness, the other non-CLO expectation the matrix names.
#
# Week 3 carries the primary result for CLO1, and criterion 2 is where that
# result is recorded. No other week links to CLO1, so this rubric is the whole
# outcome record for it.
#
# TWO SCALES ON ONE ROW. The four level labels are the course mastery scale:
# 4 exceeds standard, 3 meets standard, 2 approaching standard, 0 no evidence.
# On criterion 2 the rating the grader picks is what Canvas records against the
# Outcome, on 4, 3, 2 and 0. The criterion points on the same row are what the
# grade uses, on 25, 19, 13 and 0. Those are the mastery ratings scaled by 6.25
# and rounded to whole points. The grader picks once and both follow. The
# criterion points are never reported as the outcome result.
#
# NOTHING HERE NEEDS THE STUDENT'S NOTEBOOK. Every level is decided from the
# screenshot, the exported file and the written answer.
#
# WHY THESE CRITERIA CARRY NO OUTCOME LINK, moved here 2026-09-11. The
# sentences below used to sit inside long_description, which is the field a
# grader reads and which has to stay word for word what the assignment page
# shows the student. They are authoring rationale, not what earns credit:
#   - This is a week expectation, not a course outcome: it measures whether the work arrived, so it carries no Outcome link.
#   - This is a week expectation, not a course outcome: it measures whether you reported what you saw, so it carries no Outcome link.
#   - This is a week expectation, not a course outcome: it measures whether you reported what you saw in your own run, so it carries no Outcome link.

title: "Week 3 lab: send facts, not the email"
points: 100

criteria:

  - description: Submission completeness
    long_description: >-
      All three items are present and readable.
    points: 25
    levels:
      - description: >-
          Exceeds standard. All three items are present and readable. The file
          is attached as itself and carries the name the export cell gave it.
          The screenshot shows all six rows and the token line under them.
        points: 25
      - description: >-
          Meets standard. All three items are present. One of them is hard to
          read. Rows or the token line are cut off, or the text is too small to
          read.
        points: 19
      - description: >-
          Approaching standard. One of the three is missing. Or the file arrived
          as a zip or a link rather than as itself.
        points: 13
      - description: >-
          No evidence. Two or three of the items are absent.
        points: 0

  - description: Fact extraction
    long_description: >-
      Every email in the file carries the facts block you sent. Each block holds
      the sender facts, the three check results, the display-name mismatch, the
      link hosts, the gateway values and any attachment name. It uses the
      shipped labels and the shipped order, and its values match the parser.
    points: 25
    outcome: CLO1
    levels:
      - description: >-
          Exceeds standard. All six emails carry the facts block that was sent.
          Each block holds the sender facts, the three check results, the
          display-name mismatch, the link hosts, the gateway values and any
          attachment name. The labels and the order are the shipped ones. Every
          value agrees with the email it came from.
        points: 25
      - description: >-
          Meets standard. All six emails carry a labeled facts block in the
          shipped order. One fact group is missing from every block, or one
          email's block is missing a value the other five carry. The values
          present agree with the email they came from.
        points: 19
      - description: >-
          Approaching standard. The blocks are thin or uneven. Several fact
          groups are missing, or the block is unlabeled dictionary text rather
          than labeled lines, or fewer than six emails carry one. The file shows
          facts were sent. It does not show a sound choice of facts.
        points: 13
      - description: >-
          No evidence. No file. Or a file whose records carry no facts block.
        points: 0

  - description: Before and after comparison
    long_description: >-
      All six emails are in the file. Each one carries both verdicts, both
      confidence numbers, both indicator lists, and a changed flag that agrees
      with the two verdicts. The same six rows are readable in the screenshot. A row where nothing
      changed is a result and is graded the same as one that moved.
    points: 25
    levels:
      - description: >-
          Exceeds standard. All six emails are in the file. Each one carries the
          verdict, confidence and indicators from the body alone, the same three
          with the facts block, and a changed flag that agrees with those two
          verdicts. The screenshot shows the same six rows and the token line.
        points: 25
      - description: >-
          Meets standard. All six emails are in the file with both verdicts and
          both indicator lists. One confidence number is missing, or one
          indicator list is missing, or one changed flag disagrees with the two
          verdicts beside it. The screenshot shows the six rows.
        points: 19
      - description: >-
          Approaching standard. The file records fewer than six emails. Or it
          records one path only, so no comparison can be read. Or the screenshot
          is of a different cell.
        points: 13
      - description: >-
          No evidence. No file. Or a file with no verdicts in it.
        points: 0

  - description: Written answer
    long_description: >-
      Three to five sentences. It names one fact you left out and why a sound
      verdict does not need it. It names one email id, one indicator the
      grounded run added or dropped, and whether the verdict moved.
    points: 25
    levels:
      - description: >-
          Exceeds standard. Three to five sentences. They name one fact the
          student left out and say why a sound verdict does not need it. They
          give an email id, name an indicator the grounded run added or
          dropped, and say whether the verdict moved. Every value appears in
          the student's own file.
        points: 25
      - description: >-
          Meets standard. Three to five sentences naming a fact left out and an
          indicator that changed. One part is missing. No reason is given for
          leaving the fact out, or the email id is not given.
        points: 19
      - description: >-
          Approaching standard. Under three sentences, or two parts are missing.
          Or the answer describes the run in general words, with no fact and no
          id of the student's own in it.
        points: 13
      - description: >-
          No evidence. No written answer. Or one carrying none of the student's
          own results.
        points: 0
