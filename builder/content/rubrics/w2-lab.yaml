# Week 2 lab rubric. Four criteria, 100 points.
#
# THE SHAPE OF THIS FILE
#
#   title       what Canvas calls the rubric
#   points      the total. Every lab in this course is 100, which is what makes
#               the seven labs weigh equally inside the Labs group.
#   criteria    a list. One entry per criterion, in the order a grader reads.
#
# EVERY CRITERION CARRIES
#
#   description       the criterion name, as the week 2 spec and the alignment
#                     matrix word it. Not reworded here.
#   long_description  what earns full credit, in the words the assignment page
#                     shows the student. The two must stay identical.
#   points            the criterion's share of the 100.
#   outcome           the key of the Canvas Outcome this criterion reports
#                     into, from content/course.yaml. Omitted on a criterion
#                     that measures a non-CLO expectation.
#   levels            a list, highest first. The top level equals points.
#
# ONE CRITERION CARRIES AN OUTCOME. Criterion 2 is the primary evidence for
# CLO2 in this course, which is what the alignment matrix records. Criteria 1,
# 3 and 4 are declared non-CLO expectations and carry no Outcome link.
#
# TWO SCALES ON ONE ROW. Criterion 2's four level labels are the course mastery
# scale, so the rating the grader picks is what Canvas records against the
# Outcome, on 4, 3, 2 and 0. The criterion points on the same row are what the
# grade uses, on 50, 35, 20 and 0. The grader picks once and both follow. The
# criterion points are never reported as the outcome result.
#
# NOTHING HERE NEEDS THE STUDENT'S NOTEBOOK. Every level is decided from the
# screenshot, the exported file and the written answer.

title: "Week 2 lab: a strict answer"
points: 100

criteria:

  - description: Submission completeness
    long_description: >-
      All three items are present and readable.
    points: 15
    levels:
      - description: >-
          Full. All three items are present and readable. The file is attached
          as itself. It carries the name the export cell gave it.
        points: 15
      - description: >-
          Partial. One of the three is missing. Or the file arrived as a zip or
          a link rather than as itself.
        points: 10
      - description: >-
          Missing. Two or three of the items are absent.
        points: 0

  - description: Output validation
    long_description: >-
      The file carries four checked live answers with schema_ok: true. Its
      saved retry_demo records first-attempt problems, prompt 2 contains those
      exact problems, and attempt 2 is recorded.
    points: 50
    outcome: CLO2
    levels:
      - description: >-
          Exceeds standard. All four live emails carry a checked answer with
          schema_ok true and at least one recorded attempt. retry_demo has a
          nonempty first-attempt problems list, prompt 2 contains every exact
          problem, attempt 2 is recorded, and its final schema_ok is true.
        points: 50
      - description: >-
          Meets standard. All four live emails carry a checked answer. The
          retry demo reaches attempt 2, but one prompt or problem record is
          missing, or one accepted live try omits its empty problems list.
        points: 35
      - description: >-
          Approaching standard. The file holds answers for some emails, or it
          holds answers with no check result. It does not show both a failed
          check and a later attempt.
        points: 20
      - description: >-
          No evidence. No file, or a file with no checked answers.
        points: 0

  - description: Results screenshot
    long_description: >-
      One readable image shows all four live rows, ok=True on each row, and
      the token line.
    points: 15
    levels:
      - description: >-
          Full. One image shows all four live rows. Each row has the email id,
          verdict, category, confidence, tries used, and ok=True. The token
          line sits under the table and the text is readable.
        points: 15
      - description: >-
          Partial. One or more rows do not show ok=True, rows or the token line
          are cut off, or the text is too small to read.
        points: 10
      - description: >-
          Missing. No screenshot, or an image of a different cell.
        points: 0

  - description: Written answer
    long_description: >-
      Three to five sentences carry results from the student's file. The
      answer names a retry and copies its problem, or reports a clean run and
      its lowest confidence. It also names one instruction change without
      treating a lower confidence as greater truth.
    points: 20
    levels:
      - description: >-
          Full. Three to five sentences use the student's live results and
          complete either the retry or clean-run path. They name one
          instruction change and do not treat confidence as calibrated truth.
        points: 20
      - description: >-
          Partial. The answer is under three sentences, omits a required
          result, names no instruction change, or claims a lower confidence
          proves the model became less sure or more accurate.
        points: 10
      - description: >-
          Missing. No written answer, or one carrying none of the student's
          own live results.
        points: 0

